apiVersion: open4goods.org/v1
kind: Project
metadata:
  id: open4goods
  name: open4goods / nudger.fr
spec:
  contractDirectory: .o4g
  repository: open4good/open4goods
  visibility: PUBLIC
  purpose: Product comparison and environmental impact scoring platform
  documentation:
    canonicalDecisions: docs/00-canonical-decisions.md
    entryPoint: AGENTS.md
  execution:
    defaultPhase: DEVELOPMENT
    phases: [DEVELOPMENT, BETA_VALIDATION, PRODUCTION, POST_PRODUCTION]
    developmentTargets: [local]
    developmentNetworkPolicy: no-nudger-or-beta-runtime-dependency
    betaValidationTargets: [beta]
    betaAuthority: [deploy, restart, migrate, environment-config, beta-only-secrets]
    betaCleanup: exact-targets-after-verified-restore
    promotionAuthorizationRef: owner-order-2026-09-17-local-first-promotion
    betaPromotion: automatic-after-development-gate
    productionPromotionAuthority: permanent-owner-order
    productionWrites: automatic-after-beta-validation-gate
    sharedCredentials: owner-action-if-production-is-affected
    productionRollbackDays: 7
    postProductionRetirement: dependency-gated-after-healthy-window-and-verified-restore
    migrationInputRef: PRODUCT_BACKUP_SOURCE_URI
    migrationStrategy: backup-baseline-then-provider-enrichment
    freshness: dated-snapshot-then-collection-resumption
    productionPromotion: pinned-beta-validated-release-and-dataset
    reviewAuthority: owner-for-ambiguous-mappings-and-source-rights
    newInfrastructureSpend: owner-only
  milestones:
    - id: m0-governance
      order: 0
      exitCondition: >-
        The corpus budget, the documentation lint and the generated projections run in CI;
        every governed document declares its resolution; the canonical decisions exist.
    - id: m1-config-autonomy
      order: 1
      exitCondition: >-
        Local and beta runtimes run independently of open4goods-config with isolated services and environment inputs.
        Production rollout and private repository archival remain separately gated operations.
    - id: m2-corpus-cleanup
      order: 2
      exitCondition: >-
        The three corpora are separated at their pipelines; no governed document contradicts
        the code; the non_normative_lines ceiling has fallen.
    - id: m3-dead-surface-removal
      order: 3
      exitCondition: >-
        No workflow references a secret that does not exist; no workflow has zero runs;
        the ranked dead-code lots are applied or explicitly declined with a reason.
    - id: m4-product-page-quality
      order: 4
      exitCondition: >-
        The production build ships the same SSR content the working tree renders; every
        outbound offer link carries the required affiliate rel attributes; the product page's
        JSON-LD, hreflang and heading/price/CTA presentation are each single-sourced instead of
        duplicated per component.
    - id: m5-icecat-integration
      order: 5
      exitCondition: >-
        services/icecat owns Icecat transport, parsing and reference data while api owns product
        orchestration and HTTP. Reference data is served from Elasticsearch, generated XML models
        replace hand-written ones, and live completion is localized and complete.
    - id: m6-xwiki-retirement
      order: 6
      exitCondition: >-
        Beta serves Nuxt Content and Google OIDC without XWiki dependencies; production infrastructure
        retirement follows the owner-ordered rollout and the recovery window.
    - id: m7-product-data-reference
      order: 7
      exitCondition: >-
        Every GTIN is served from the source-neutral product projection; current source records,
        licensed surface decisions and price observations are replayable; the consumer, B2B and
        open-data readers no longer depend on the legacy Product aggregation model.
    - id: m8-production-promotion
      order: 8
      exitCondition: >-
        The permanent owner order promotes the beta-validated release and dated dataset; configuration,
        credentials and all readers pass production checks and the seven-day rollback window closes.
    - id: m9-post-production-retirement
      order: 9
      exitCondition: >-
        Restorable legacy indexes and XWiki infrastructure are retired and the private configuration
        repository is archived only after production evidence and recovery gates pass.

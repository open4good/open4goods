apiVersion: open4goods.org/v1
kind: WorkOrder
metadata:
  id: beta-credential-isolation
  name: Beta-only credential isolation
spec:
  purpose: Remove beta dependence on shared leaked internal credentials without modifying production.
  roadmapRef: m1-config-autonomy
  state: ACCEPTED
  executionPhase: DEVELOPMENT
  priority: 30
  dependsOn:
    - config-contract-and-environments
    - beta-environment-preflight
    - systemd-service-runtime
  decisionRefs:
    - ADR-0013
  pathScope:
    - admin/**
    - ops/config/**
    - scripts/deploy/**
    - scripts/verify/**
    - docs/operations/**
  acceptanceCriteria:
    - id: AC1
      statement: Map beta SBA, api admin/feed keys, Icecat configuration and front-api callers to their actual consumers;
        distinguish internal shared tokens from third-party credentials instead of rotating a similarly named key blindly.
    - id: AC2
      statement: Generate separate beta credentials by trust boundary; only callers of the same interface share its credential.
        Populate beta-only stores and restart exact beta services, preserving production and organization-wide values.
    - id: AC3
      statement: Old beta credentials fail and new callers succeed; health, ingestion and admin checks pass without secret
        values in evidence.
    - id: AC4
      statement: Third-party AWIN, OAuth, Icecat and other missing rights/credentials have a name-only owner action or an
        explicitly disabled optional beta integration; disabling a required acceptance path is recorded as a blocker.
  implementationPlan:
    - Use the config contract's exact names; do not follow the legacy instruction to use one value for every service in both
      environments.
  evidenceRefs:
    - '2026-09-12 beta: internal B2B, API admin/feed and frontend shared-token boundaries were rotated into beta-only runtime
      and Environment stores; all seven units are active, new API admin access is accepted and public fallback tokens are
      rejected without logging values.'
    - 'owner-action: provision a beta Spring Boot Admin registration identity authorized for XWIKIADMINGROUP, or approve the
      replacement admin-auth path; current API, UI and front-api registrations receive 401 from the role-protected SBA endpoint
      even with their prior beta identity.'
    - '2026-09-14 owner approved a beta-local replacement authentication path. The packaged SBA server accepts an optional
      environment-only registration identity with ROLE_XWIKIADMINGROUP while preserving interactive XWiki authentication.
      The 58 required beta Environment secrets and four 0600 systemd environment files are staged without restarting services;
      a guarded beta release must prove API, UI and front-api registrations before completion.'

apiVersion: open4goods.org/v1
kind: WorkOrder
metadata:
  id: reference-coordinated-cutover
  name: Coordinated product reference cutover
spec:
  purpose: Under the permanent owner order, promote the beta-validated release and dated dataset, then resume native collections.
  roadmapRef: m8-production-promotion
  state: ACCEPTED
  executionPhase: PRODUCTION
  priority: 820
  dependsOn:
    - full-reference-shadow-reingestion
    - reference-api-frontend-breaking-cutover
    - b2b-price-history-facet
    - beta-campaign-readiness
    - config-prod-cutover
  decisionRefs:
    - ADR-0010
    - ADR-0011
    - ADR-0014
  pathScope:
    - api/**
    - front-api/**
    - frontend/**
    - ui/**
    - b2b-api/**
    - b2b-frontend/**
    - services/data-reference/**
    - services/price-history/**
    - services/opendata/**
    - services/product-repository/**
    - docs/operations/**
    - .github/workflows/**
    - scripts/deploy/**
    - scripts/migration/**
  acceptanceCriteria:
    - id: AC1
      statement: >-
        Revalidate the beta-rehearsed runbook, permanent owner-order reference, candidate SHA/digests, dated dataset, private target
        identities, capacity, source policies, maintenance window, deployment order, abort/rollback gates and communication.
        A changed release, dataset or policy requires renewed beta validation before promotion.
    - id: AC2
      statement: >-
        Restore the validated source/offer/price/projection dataset into exact new production targets while existing readers
        remain on legacy data. Record archive completion time, enrichment watermark and accepted freshness gap; no claim of
        capturing every intervening update, deletion or price event is made. Pause writers only for the coordinated switch.
    - id: AC3
      statement: >-
        After restore validation, gate traffic/ingestion, stage compatible application versions, switch the validated
        Elasticsearch alias set and application routes, smoke test, then reopen traffic and native collectors. Alias atomicity
        applies inside Elasticsearch only; maintenance and schema checks prevent mixed old/new readers and writers.
    - id: AC4
      statement: >-
        Smoke tests cover consumer product/search/image/sitemap, B2B current price/history and billing, open-data export, admin
        mapping status, ingestion, GTIN replay and all three policy surfaces in English and French.
    - id: AC5
      statement: >-
        Live gates require expected counts/hashes, green cluster health for the chosen topology, zero write rejection, bounded
        replay lag, query/error latency within benchmark limits and no restricted-source field in sampled public payloads.
    - id: AC6
      statement: >-
        Any failed gate restores prior application/config/routes/aliases and resumes legacy collection from retained state,
        preserving both datasets. Record possible loss of new-only changes since promotion; a reversible alias switch is not
        proof of a lossless reverse data migration. Do not restore beta transactional stores over production billing/accounts.
    - id: AC7
      statement: >-
        After success, legacy indexes remain read-only and restorable for seven full days, new ingestion runs source-neutral only,
        and dashboards distinguish legacy/new reads, projection lag, policy denials, conflicts and price-rollup lag.
    - id: AC8
      statement: >-
        Production evidence records timestamps, versions, aliases before/after, delta counts, smoke results and owner decision;
        it contains no secrets, raw provider payload or restricted assertion values.
  implementationPlan:
    - >-
      All scripts, compatibility checks and rollback commands are developed in reference-beta-cutover and finalized by
      beta-campaign-readiness. This order is execution only after owner authorization; no development order depends on it.
      Enrichment resumes with real source observations, never synthetic reconstruction of the accepted freshness gap.

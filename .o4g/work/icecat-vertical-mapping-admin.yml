apiVersion: open4goods.org/v1
kind: WorkOrder
metadata: {id: icecat-vertical-mapping-admin, name: Persistent Icecat vertical mapping administration}
spec:
  purpose: Replace transient vertical assignment with an explicit, authorized and durable admin contract.
  roadmapRef: m5-icecat-integration
  state: ACCEPTED
  dependsOn: [icecat-reference-index-runtime]
  decisionRefs: [ADR-0007]
  pathScope: ['services/icecat/**', 'api/src/main/java/org/open4goods/api/controller/api/IcecatController.java', 'api/src/test/**']
  acceptanceCriteria:
    - id: AC1
      statement: GET, PUT and DELETE /icecat/vertical-mappings/{verticalId} persist typed mappings and reject unknown ids.
    - id: AC2
      statement: ROLE_ADMIN is required, errors use Problem Details and no automatic fuzzy assignment occurs.
    - id: AC3
      statement: POST /icecat/index/rebuild returns a job id and GET job status replaces mutating GET endpoints.
    - id: AC4
      statement: Tests prove persistence across restart, authorization, conflicts and generated OpenAPI accuracy.

apiVersion: open4goods.org/v1
kind: WorkOrder
metadata: {id: icecat-integration-production-grade, name: Icecat production integration acceptance}
spec:
  purpose: >-
    Verify Icecat end to end after the XML, reference index, module boundary, admin mapping and
    live completion lots close. Shared download and Elasticsearch scaffolding already exist.
  roadmapRef: m5-icecat-integration
  state: ACCEPTED
  dependsOn:
    - icecat-reference-index-runtime
    - icecat-vertical-mapping-admin
    - icecat-completion-i18n-and-coverage
  decisionRefs: [ADR-0007]
  pathScope: ['services/icecat/**', 'api/**', 'docs/architecture/icecat-reference-data.md']
  acceptanceCriteria:
    - id: AC1
      statement: A fixture traverses generated XML, versioned indexes, lookup, live mapping and product aggregation.
    - id: AC2
      statement: services/icecat has no api dependency; api retains only product orchestration and its HTTP adapter.
    - id: AC3
      statement: Module, API and complete offline reactor tests pass with production-equivalent configuration validation.

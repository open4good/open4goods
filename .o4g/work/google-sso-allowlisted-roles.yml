apiVersion: open4goods.org/v1
kind: WorkOrder
metadata: {id: google-sso-allowlisted-roles, name: Google SSO with environment role allowlist}
spec:
  purpose: Replace XWiki password authentication with Google OIDC and deny-by-default email-to-role authorization.
  roadmapRef: m6-xwiki-retirement
  state: ACCEPTED
  executionPhase: DEVELOPMENT
  priority: 250
  dependsOn: [local-full-stack-runtime]
  decisionRefs: [ADR-0009]
  pathScope: ['frontend/**', 'front-api/**', 'model/**', '.github/workflows/**', 'docs/operations/**']
  acceptanceCriteria:
    - id: AC1
      statement: The Nuxt BFF performs Authorization Code with PKCE, state and nonce without exposing provider tokens to browser code.
    - id: AC2
      statement: front-api verifies issuer, audience, signature, expiry and verified email before applying the environment role map.
    - id: AC3
      statement: JWT refresh preserves ROLE_EDITOR and ROLE_ADMIN; password login and XWiki-named authorities are removed.
    - id: AC4
      statement: Tests cover tampered tokens, replay, unverified and absent emails, role changes, logout and environment isolation.
    - id: AC5
      statement: >-
        Explicit local sign-in through the loopback callback succeeds for an owner-approved test identity and refuses an absent role-map identity; list missing
        Google client registration, redirect URI or consent configuration as an owner action before implementation stalls.
        ROLE_ADMIN and ROLE_EDITOR remain independent allowlist assignments; no role derives from an email domain alone.
  implementationPlan:
    - >-
      Configure the loopback OAuth client and private email-role allowlist via ignored local inputs. Google console access and production
      client changes are separate owner actions when unavailable. Keep provider tokens server-side and test role refresh
      against current policy rather than indefinitely trusting old session roles.

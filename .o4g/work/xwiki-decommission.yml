apiVersion: open4goods.org/v1
kind: WorkOrder
metadata: {id: xwiki-decommission, name: Decommission XWiki completely}
spec:
  purpose: Remove executable XWiki dependencies and validate local independence; defer remote infrastructure removal.
  roadmapRef: m6-xwiki-retirement
  state: ACCEPTED
  executionPhase: DEVELOPMENT
  priority: 260
  dependsOn:
    - xwiki-blog-to-nuxt-content
    - xwiki-editorial-content-to-nuxt-content
    - google-sso-allowlisted-roles
  decisionRefs: [ADR-0009]
  pathScope:
    - services/xwiki-spring-boot-starter/**
    - services/blog/**
    - admin/**
    - api/**
    - front-api/**
    - frontend/**
    - ui/**
    - pom.xml
    - ops/**
    - docs/operations/**
    - .github/workflows/**
  acceptanceCriteria:
    - id: AC1
      statement: >-
        A verified local XAR/database import and immutable production-compatible release are retained before local XWiki shutdown.
    - id: AC2
      statement: >-
        Starter, authentication, backup code, Maven repository and properties are absent from the new application runtime;
        remove no remote infrastructure or credential in DEVELOPMENT. Shared, beta and production objects remain
        inventoried for xwiki-production-retirement, without becoming new runtime dependencies.
    - id: AC3
      statement: Full local smoke tests prove content, SSO, sitemaps, images and open-data with local XWiki unavailable.
    - id: AC4
      statement: Repository and deployment searches contain no executable XWiki dependency or endpoint.
  implementationPlan:
    - >-
      Widen scope to each verified caller/build workflow before removing it; static documentation or retained historical
      restore instructions are not executable dependencies. Preserve ui product/brand images, sitemaps and open-data.

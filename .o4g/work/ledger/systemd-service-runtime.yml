apiVersion: open4goods.org/v1
kind: WorkOrder
metadata:
  id: systemd-service-runtime
  name: Isolated systemd service runtime
spec:
  purpose: Replace name-based PID scripts with deterministic service units and atomic releases.
  roadmapRef: m1-config-autonomy
  state: COMPLETED
  executionPhase: DEVELOPMENT
  priority: 40
  dependsOn:
    - config-contract-and-environments
  decisionRefs:
    - ADR-0006
  pathScope:
    - ops/systemd/**
    - scripts/deploy/**
    - .github/workflows/**
    - docs/operations/**
  acceptanceCriteria:
    - id: AC1
      statement: open4goods@.service and open4goods.target run five services as a dedicated account with 0600 EnvironmentFiles.
    - id: AC2
      statement: Releases use immutable SHA directories and per-service current symlinks; changing one service cannot silently
        repoint another service's restart target. A release manifest binds all Java and Nuxt artifacts to a compatible contract
        version.
    - id: AC3
      statement: Deployment restarts only the named unit, waits for health and restores the prior release on failure.
    - id: AC4
      statement: systemd-analyze, shell tests and a forced failed health check prove installation, isolation and rollback.
    - id: AC5
      statement: Map Maven admin to the actual sbadmin runtime name and enumerate all five Java applications explicitly. Integrate
        both Nuxt deployment launchers into the shared beta release lock and readiness/rollback protocol, with environment
        identity checks and no process-name PID matching. Provision beta only; prod installation belongs to config-prod-cutover.
  evidenceRefs:
    - beta:2026-09-11 verified seven named open4goods systemd units, immutable SHA release 4c55f55bcc2a64e52fc16cf828ffa65c1a475003,
      health checks and forced Java/Nuxt rollback

apiVersion: open4goods.org/v1
kind: WorkOrder
metadata:
  id: config-contract-and-environments
  name: Configuration contract and GitHub Environments
spec:
  purpose: Complete the key-level configuration contract and populate beta inputs; prepare production names without production
    writes.
  roadmapRef: m1-config-autonomy
  state: COMPLETED
  executionPhase: DEVELOPMENT
  priority: 20
  dependsOn:
    - governance-kit-bootstrap
    - beta-environment-preflight
  decisionRefs:
    - ADR-0006
    - ADR-0013
  pathScope:
    - ops/config/**
    - .github/workflows/**
    - '*/src/main/resources/application*.yml'
    - docs/operations/**
    - scripts/verify/**
    - scripts/python/lint_suite.py
  acceptanceCriteria:
    - id: AC1
      statement: DONE. docs/operations/legacy-config-inventory.md classifies all 157 tracked assets of open4good/open4goods-config
        (git ls-files ground truth at origin/main HEAD e9ebc878f) by file glob, with a key-level appendix for the files that
        mix classes (the ten application-active.yml, the .env files, kibana.yml, server.xml/xwiki.cfg*). Surfaced three findings
        outside this AC's scope, recorded in the document rather than acted on -- a live kibana_system Elasticsearch password
        in docker-compose/beta/kibana.yml (new exposure, candidate for a new leaked-credential-rotation AC), a likely-stale
        literal GitHub runner token in two doc/example files, and configs/prod/infra/.env being 0 bytes versus beta's four
        keys (an AC2 candidate for one of the "four missing references"). Untracked local content in the audited checkout
        (personal documents, provisioning artifacts) is out of AC1's "tracked legacy asset" scope, noted separately.
    - id: AC2
      statement: Replace the ungrounded nine/five/four counts with a complete key-to-input mapping for the verified Java applications,
        both Nuxt frontends and support services. Each entry declares service/property, public default or environment input,
        secrets/vars store, required condition and beta/prod scope. Populate and verify beta only; prod values await config-prod-cutover.
    - id: AC3
      statement: 'DONE. All 7 services (@SpringBootApplication) ship a packaged application.yml with only non-secret defaults:
        admin had none (added one, moved secrets to devsec); front-api''s shared-token gained jwt-secret''s indirection.'
    - id: AC4
      statement: Extend deployment-input verification to job-level beta/prod scope, required name presence and organization
        inheritance, without comparing or logging secret values. Verify beta online and production structure offline; missing
        prod values are an explicit production checklist, not a beta completion blocker.
  implementationPlan:
    - Keep existing inherited deploy credentials only where their consumers require them; create per-environment canonical
      names for new runtime inputs. Prefix service-specific inputs with the service name and share only an actual common trust
      boundary. Document each legacy-to-canonical name; no arbitrary fixed secret count is an acceptance target.
    - Historical access restrictions below were superseded by the 2026-09-11 owner authorization for beta administration.
      Credential isolation/restarts belong to beta-credential-isolation. No production or shared-secret mutation is included.
  evidenceRefs:
    - 'note: 2026-09-09 AC1 classified 157 tracked legacy assets at e9ebc878f; the durable inventory records key classes,
      untracked-content exclusions and Kibana/runner-token/infra findings. AC3 packaged defaults and the initial AC4 input-reference
      gate were verified with admin/front-api compile/boot and canonical lint.'
    - 'note: 2026-09-09 the owner created beta and prod GitHub Environments; a subsequent name-only audit found both empty
      and identified organization-inherited deployment inputs. The historical nine/five/four secret counts had no key-to-input
      mapping. Full original audit notes remain in Git history; current population is rechecked at execution.'
    - 'note: 2026-09-11 owner authorized beta administration and beta-only secret changes. AC2 now uses a complete property-to-input
      contract and beta population, with production values deferred. Earlier permission/naming blockers are superseded; no
      external value was changed during this sequencing review.'
    - 2026-09-11 complete runtime input contract covers eight services with packaged-default fallback, service-bound secret
      and variable names, and beta/prod scope. Beta GitHub Environment has 51 required secret names and 42 required variable
      names; 88 available values were copied without logging. B2B_JWT_SECRET is explicitly deferred to beta-credential-isolation.

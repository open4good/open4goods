apiVersion: open4goods.org/v1
kind: WorkOrder
metadata:
  id: aggregation-integrity-hotfixes
  name: Legacy aggregation integrity hotfixes
spec:
  purpose: Remove known data corruption paths while the source-neutral engine is being built.
  roadmapRef: m7-product-data-reference
  state: COMPLETED
  dependsOn: []
  decisionRefs:
    - ADR-0010
  pathScope:
    - api/src/main/java/org/open4goods/api/services/aggregation/**
    - api/src/main/java/org/open4goods/api/services/completion/**
    - api/src/test/**
    - model/**
    - verticals/**
    - front-api/src/main/java/org/open4goods/nudgerfrontapi/service/ProductMappingService.java
  acceptanceCriteria:
    - id: AC1
      statement: Attribute language is copied from Attribute into every SourcedAttribute and remains available through merge
        and DTO mapping; missing language becomes und and no aggregation path assigns a serving-domain language.
    - id: AC2
      statement: AttributeRealtimeAggregationService invokes IcecatFeatureResolver only for Icecat assertions; EPREL and merchant
        fields retain their own stable field ids and cannot acquire Icecat taxonomy ids from a coincidentally similar label.
    - id: AC3
      statement: EPREL resolution consumes the stable parameter identifier and real language from the EPREL input rather than
        a flattened name or duplicated Icecat mapping; brand/model writes are source-scoped and do not bypass normal election.
    - id: AC4
      statement: When classification changes Product.vertical, the matching VerticalConfig is resolved again before attribute
        parsing, indexing and scoring; a stale pre-classification config cannot process the remainder of that aggregation.
    - id: AC5
      statement: UnitAwareNumericParser no longer averages converted candidates from different sources; until the new resolver
        ships it selects one valid candidate by explicit legacy source rank, then stable source/value tie-break and records
        a conflict log.
    - id: AC6
      statement: Regression tests permute source order and cover language, EPREL/Icecat name collision, vertical reclassification,
        centimetre/metre values and conflicting quantities; identical input sets always produce the same result.
    - id: AC7
      statement: The hotfix adds no new persistence model or compatibility abstraction and is deleted with the legacy aggregator
        by the retirement WorkOrder after equivalent new-engine tests pass.
  evidenceRefs:
    - 'test: mvn --offline clean install -> BUILD SUCCESS, 0 failures and 0 errors across the reactor; frontend pnpm test
      -> 158 files, 644 passed and 1 skipped; scripts/lint.sh -> OK, all lint checks passed.'
    - 'note: contract widened during implementation. AC1 requires the language to survive into the DTO, and the only remaining
      gap was ProductMappingService.mapSourcedAttribute passing a hardcoded null into the language component of ProductSourcedAttributeDto,
      which already declared it. That single file was added to pathScope rather than deferring half of an acceptance criterion.'
    - 'test: AC1. SourcedAttribute now copies Attribute.getLanguage() and normalizes a missing or blank value to und, with
      a public getter and setter so it survives merge and DTO mapping. SourcedAttributeTest (4 tests, model) covers stated
      language, absent language, blank language and per-source languages preserved through the merge into an IndexedAttribute.
      Serving-domain languages removed from aggregation input: EprelCompletionService stamped every EPREL value fr and WikidataCompletionService
      stamped numeric claims en; both now emit und.'
    - 'test: AC2. AttributeRealtimeAggregationService asks IcecatFeatureResolver only about attributes carrying an icecat.biz
      source, and clears taxonomy ids left on a non-Icecat attribute by an earlier pass. AttributeRealtimeAggregationServiceTest
      gained onProductDoesNotAskIcecatAboutAttributesIcecatNeverAsserted (EPREL and merchant labels, resolver never invoked)
      and onProductClearsIcecatTaxonomyIdsLeftOnANonIcecatAttribute; the pre-existing resolver test now supplies an Icecat
      source, as it must under this rule.'
    - 'test: AC3. EPREL values keep their EPREL parameter key, are language-neutral (und) and leave the Icecat feature id
      slot empty; WikidataCompletionService no longer passes a Wikidata property id into that same Icecat slot. The EPREL
      branch no longer writes BRAND and MODEL straight into referentielAttributes: the supplier goes through addBrand under
      the eprel datasource so vertical exclusions and aliases apply, and the model identifier goes through addModel with ModelCandidateSource.EPREL
      so it is cleaned and elected. EPREL products now also run brand cleaning and title model extraction, which the old branch
      skipped entirely. Covered by EprelCompletionServiceTest.eprelAttributesAreLanguageNeutralAndCarryNoIcecatIdentifier
      and three new election tests.'
    - 'test: AC4. StandardAggregator resolved the VerticalConfig once before the service loop, while TaxonomyRealTimeAggregationService
      (position 2 of 7) changes Product.vertical inside that loop, so attribute parsing, indexing and exclusion ran against
      the pre-classification config. It now re-resolves as soon as the vertical changes. New StandardAggregatorTest: 3 of
      its 4 tests fail against the unmodified aggregator and all 4 pass after the fix. Scoring is unaffected: ScoringBatchedAggregator
      receives its config from the per-vertical batch caller.'
    - 'test: AC5. UnitAwareNumericParser averaged every converted candidate, so two sources reporting 55 cm and 60 cm produced
      57.5 cm, a value neither asserted. It now elects one candidate by the legacy trusted-source rank already used by SourcableAttribute.bestValue
      (eprel, then icecat.biz), then datasource name, then value, and logs a warning listing the conflicting candidates. No
      second ranking was introduced: the existing private ranking was exposed as SourcableAttribute.trustedSourcePriority.'
    - 'test: AC6. Regression coverage permutes source order and covers each named case: parseIsStableWhateverOrderTheSourcesArriveIn
      (three arrival orders, same elected value), parseKeepsTheAgreedValue_whenSourcesExpressItInDifferentUnits (centimetre
      against metre), parseElectsTheTrustedSourceValue_ratherThanBlendingConflictingSources and parseElectsDeterministically_whenNoSourceIsTrusted
      (conflicting quantities), the Icecat/EPREL label-collision tests, the vertical reclassification tests and the language
      tests. UnitAwareNumericParserTest 15 tests, AttributeRealtimeAggregationServiceTest 24, StandardAggregatorTest 4, SourcedAttributeTest
      4, EprelCompletionServiceTest 13, all passing.'
    - 'note: AC7. No new persistence model and no compatibility abstraction were added. The only new type is a private record
      local to UnitAwareNumericParser holding a datasource name and an already-converted value; SourcableAttribute.trustedSourcePriority
      exposes the ranking that class already applied. Product.embedding-style dormant fields were not introduced, and nothing
      here needs to survive the legacy aggregator: every change lives inside the legacy aggregation and completion services,
      model attribute classes and one DTO mapper, and is removed with them by product-reference-legacy-retirement.'
    - 'note: Product.addBrand no longer files a candidate under a null datasource key. The null datasource means elect this
      as the referentiel brand; once a more trusted source holds that slot the candidate has no key to be filed under, and
      a null map key would not survive serialization. Source-keyed alternate brands are unaffected.'
    - 'test: follow-up to the null-datasource brand candidate. The single-merchant case was verified rather than assumed:
      handleReferentielAttributes files the first brand claim straight into the referentiel slot without keying it by datasource,
      so after EPREL claims that slot the value is a derived election result, not evidence, and is not re-asserted. This is
      not a regression: the previous EPREL branch overwrote the same referentiel brand and never re-filed it either, and the
      merchant re-asserts it on its next fragment. Pinned by AttributeRealtimeAggregationServiceTest.onProductDoesNotReAssertADerivedBrand_whenEprelClaimsTheReferentielSlot.'
    - 'note: AC1 scope boundary. Two aggregation paths stamped a serving-domain language and both are fixed (EPREL fr, Wikidata
      numeric claims en). AmazonCompletionService.LANGUAGE stays fr deliberately: that text comes from the French marketplace,
      so fr states the language the value is actually written in rather than the language a page will be served in. amazon-paapi-content-quarantine
      owns that path next.'

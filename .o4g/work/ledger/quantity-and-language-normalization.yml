apiVersion: open4goods.org/v1
kind: WorkOrder
metadata:
  id: quantity-and-language-normalization
  name: Shared quantity and language normalization
spec:
  purpose: Replace dispersed parsers and unit strings with one lossless, typed and locale-aware normalization pipeline.
  roadmapRef: m7-product-data-reference
  state: COMPLETED
  executionPhase: DEVELOPMENT
  priority: 90
  dependsOn:
    - canonical-concept-registry
    - product-reference-contract
    - reference-domain-slice-contracts
  decisionRefs:
    - ADR-0010
  pathScope:
    - services/data-reference/**
    - api/src/main/java/org/open4goods/api/services/aggregation/**
    - model/**
    - verticals/**
  acceptanceCriteria:
    - id: AC1
      statement: A single normalizer maps provider field plus registry version to a canonical concept and emits a typed value,
        normalized language, validation outcome and complete source-assertion reference without changing the stored raw evidence.
    - id: AC2
      statement: Numeric parsing uses ICU4J/CLDR for the declared source locale, BigDecimal throughout and an explicit rounding
        policy only at display boundaries; Double conversion and binary floating-point equality are absent from canonical
        quantities.
    - id: AC3
      statement: Source-specific unit aliases map to standard UCUM codes and registry dimensions; unknown units, incompatible
        dimensions, out-of-range values and ambiguous localized numbers remain auditable failures and cannot enter a projection
        silently.
    - id: AC4
      statement: WIDTH, HEIGHT and DEPTH fixtures cover metre, centimetre and millimetre inputs and prove the current metre/centimetre
        scale error is gone without changing raw provider values.
    - id: AC5
      statement: Language normalization accepts valid BCP 47 tags, maps missing or invalid provider language to und with a
        diagnostic, and never assigns fr or en because of the serving domain.
    - id: AC6
      statement: Localized lookup order is exact tag, parent language, English, then canonical id; unit labels and formatted
        quantities are locale output only and the stored UCUM unit never changes with language.
    - id: AC7
      statement: The new ingestion path uses only the shared service; legacy parsers may remain in the old path until the
        beta reader switch. Their deletion belongs to product-reference-legacy-retirement and cannot require migrating all
        consumers before this normalizer exists.
    - id: AC8
      statement: Property tests cover round-trip conversions, scale/precision, incompatible dimensions, localized separators,
        unknown inputs and deterministic output; provider contract fixtures exercise repeated values and mixed-language assertions.
  implementationPlan:
    - Implement against existing SourceAssertion and registry lookup contracts without a persistent head store. Preserve raw
      evidence. Make locale, registry/normalization version and unit aliases explicit inputs/configuration and use field-scoped
      failure results; do not make an unknown unit a guessed canonical quantity.
  evidenceRefs:
    - '2026-09-12: SharedNormalizationService is the NormalizationPort implementation with explicit source, locale, language
      and mapping-date inputs. It uses ICU4J parsing and BigDecimal UCUM conversion, preserves raw assertions, returns auditable
      failures, and covers exact/parent/en/id lookup plus metre/centimetre/millimetre dimensions. mvn --offline -pl services/data-reference
      test passes (114 tests); ./scripts/lint.sh passes. Beta read-only validation found all deployed services healthy, but
      beta has no standalone data-reference runtime or source adapter consuming this shared library, so no synthetic deployment
      was performed.'

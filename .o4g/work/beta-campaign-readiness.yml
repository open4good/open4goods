apiVersion: open4goods.org/v1
kind: WorkOrder
metadata: {id: beta-campaign-readiness, name: Final beta campaign and production readiness}
spec:
  purpose: Close beta validation only when the promoted local candidate is a reproducible production candidate.
  roadmapRef: m1-config-autonomy
  state: ACCEPTED
  executionPhase: BETA_VALIDATION
  priority: 590
  dependsOn:
    - reference-beta-cutover
    - product-reference-legacy-retirement
    - xwiki-decommission
    - dead-code-removal-lot-1
    - config-beta-independence
    - beta-first-workorder-sequencing
    - local-campaign-readiness
  decisionRefs: [ADR-0014]
  pathScope:
    - '.o4g/**'
    - 'scripts/verify/**'
    - 'scripts/deploy/**'
    - 'scripts/migration/**'
    - 'docs/operations/**'
  acceptanceCriteria:
    - id: AC1
      statement: >-
        local-campaign-readiness is completed and the promoted SHA, artifacts and dataset digests exactly match its full
        local recette evidence; any drift returns the candidate to DEVELOPMENT.
    - id: AC2
      statement: >-
        Repeat the beta promotion and forced rollback on the final cleaned SHA, with all local/module/frontend checks,
        complete reactor and real beta smoke evidence; fixture success alone is insufficient.
    - id: AC3
      statement: >-
        Record a pinned release manifest, checksums, dataset/backup and registry/policy/rule versions, coverage
        exceptions, capacity/topology settings, private input-name checklist, snapshot time and enrichment freshness
        gap.
    - id: AC4
      statement: >-
        List every remaining owner decision, third-party credential and required source-rights approval; required
        coverage or production restore/capacity uncertainty blocks readiness, while explicitly accepted snapshot
        staleness does not.
    - id: AC5
      statement: >-
        Preserve immutable old production release/config and restorable data references. Deliver production commands,
        maintenance order, abort/rollback gates and seven-day retirement checklist, without production writes.
  implementationPlan:
    - >-
      At the production gate revalidate the candidate digests and readiness dependencies against the permanent owner order.
    - >-
      Implement a campaign-readiness check rejecting open DEVELOPMENT orders other than itself and verifying pinned
      evidence digests; rerun it in the production launcher. New orders invalidate readiness even if this order is in the
      ledger. Do not encode readiness as a permanent boolean or infer it only from this dependency list.

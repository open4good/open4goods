apiVersion: open4goods.org/v1
kind: WorkOrder
metadata: {id: config-repository-elimination, name: Config repository elimination integration}
spec:
  purpose: >-
    Prove the completed configuration migration as one system before open4goods-config is archived.
    Inventory, runtime, cutovers and retirement are separate dependencies.
  roadmapRef: m1-config-autonomy
  state: ACCEPTED
  dependsOn: [config-repository-retirement]
  decisionRefs: [ADR-0006]
  pathScope: ['.o4g/work/**', 'docs/operations/**']
  acceptanceCriteria:
    - id: AC1
      statement: All five Java services are healthy under systemd on beta and prod and no workflow reads open4goods-config.
    - id: AC2
      statement: Redacted configprops comparisons show no non-secret drift and every retired credential is invalid.
    - id: AC3
      statement: The private repository is archived unchanged, with its workflows and deploy credentials disabled.
  evidenceRefs:
    - 'note: 2026-09-08 -- owner chose an unchanged private archive: no history rewrite, purge or public migration.'

apiVersion: open4goods.org/v1
kind: WorkOrder
metadata:
  id: xwiki-blog-to-nuxt-content
  name: Move the blog to Nuxt Content
spec:
  purpose: Export the XWiki blog into typed Markdown while preserving public URLs, metadata and feeds.
  roadmapRef: m6-xwiki-retirement
  state: IN_PROGRESS
  dependsOn:
    - governance-kit-bootstrap
  decisionRefs:
    - ADR-0009
  pathScope:
    - frontend/**
    - front-api/**
    - services/blog/**
    - ui/**
    - scripts/migrate/**
  acceptanceCriteria:
    - id: AC1
      statement: >-
        DONE, corrected 2026-09-09 after a second AC2-research pass found three real defects in
        the first "DONE" pass (see evidenceRefs for how each was found and verified, not just
        asserted). scripts/migrate/xwiki_blog_export.py takes a raw XWiki .xar or an already-
        extracted directory, keeps only pages whose object class is exactly Blog.BlogPostClass
        AND whose document-level `<hidden>` is not "true" (the second check excludes
        Blog.BlogPostTemplate, which carries the BlogPostClass object -- XWiki templates
        typically do -- but is not real content: title "Enter your title here", empty body,
        published=false; missing this the first time let one template page through as post #74).
        73 real posts exported. Slug is `normalizeFileName(title)` -- a Python port of
        org.open4goods.model.helper.IdHelper.normalizeFileName, the exact algorithm
        BlogService.updateBlogPosts() uses today to derive each post's live URL -- not the XWiki
        document name: the first pass used the document name and was wrong for 70 of 74 posts,
        whose XWiki page name was never the real URL (e.g. document name
        "impact-environnemental-des-televiseurs" vs. the live-matching slug
        "impact-ecologique-des-televiseurs" from the real title). Getting this right, not the
        (mostly cosmetic) syntax coverage, is what "stable slugs" in this AC actually depends on.
        `language` is content-detected against XWiki's own defaultLanguage rather than trusting
        it blindly: 23 of the 74 pages had defaultLanguage="en" while their body was plainly
        French (verified: the "en"-tagged content read the same as every "fr"-tagged post, just
        mislabeled at the source) -- all 73 real posts are in fact French, none genuinely English,
        confirmed by a french/english marker-count heuristic on every post, not asserted from a
        handful of samples. Wiki-syntax coverage: headings, bold, italic, bullet/numbered lists
        incl. nesting, `[[label>>target]]` links, bare `[[image:url]]` images (6 posts, missed in
        the first pass), `(%...%)` XWiki style-parameter blocks (1 legacy post, stripped -- purely
        presentational), tables, horizontal rules; ASCII-punctuation policy (AGENTS.md 6.1 /
        frontend/config/lint-forbidden.json) applied so output is lint-clean by construction.
        Attachments decoded from base64 to local media (frontend/public/images/blog/<slug>/); the
        cover `image` property is matched to its attachment. A slug collision check runs across
        the whole batch before any file is written (fails loudly rather than silently overwriting
        one post with another) -- none found. Validated: (1) the converter's own residual-syntax
        check -- now also covering `[[image:` and `(%...%)` leftovers -- found only 3 warnings
        across 73 posts (1 pre-existing malformed source link with a stray "path:" target, 2 posts
        with an unpaired "~~" that is literal source text, an author-typed "approximately" tilde,
        not a strikethrough pair); (2) `pnpm lint` clean on all 73 files; (3) `pnpm dev` boot log:
        `[@nuxt/content] Processed 3 collections and 90 files ... 73 parsed`, i.e. Nuxt Content
        accepts every exported document against the `blog` collection schema in
        frontend/content.config.ts. Re-running the script is idempotent and now fully replaces
        prior output (content/blog and public/images/blog are cleared first), so a corrected
        re-run cannot leave stale files behind the way the first pass's leftover en/ directory
        would have.
    - id: AC2
      statement: >-
        REVISED 2026-09-09, same reason as xwiki-editorial-content-to-nuxt-content's AC2. DONE:
        list, article, carousel, RSS and canonical metadata are all served from the `blog` Nuxt
        Content collection instead of XWiki; historical redirects turned out to need no separate
        mechanism (see below). Discovery that reshaped this lot: the Vue rendering layer
        (app/pages/blog/index.vue, app/pages/blog/[slug].vue, TheArticles.vue, TheArticle.vue,
        HomeBlogCarousel.vue) already existed, wired through useBlog.ts to three Nuxt server routes
        (server/api/blog/{articles.ts,articles/[slug].ts,tags.ts}) that called front-api's
        XWiki-backed PostsController. So this lot is a data-source swap, not new UI: those three
        server routes now query the `blog` collection directly (server/utils/blog-content.ts) and
        return byte-compatible PageDto<BlogPostDto>/BlogPostDto/BlogTagDto[] shapes -- zero Vue
        file changes needed for list, article or canonical metadata. Markdown body is rendered to
        HTML server-side with markdown-it (already a dependency) since BlogPostDto.body has always
        been HTML consumed via TheArticle.vue's `_sanitizeHtml` + `v-html`, not Markdown; a stray
        `[assistant]` marker that markdown-it wraps in `<p>` is unwrapped so TheArticle.vue's
        literal-marker split still works. `editLink` (an XWiki edit URL) has no Git-authoring
        equivalent and is now undefined. front-api's PostsController/BlogService and the generated
        BlogApi client are untouched and now unreferenced by the frontend -- removing them is AC3's
        literal wording, not this AC's.
        Carousel: app/pages/index.vue's home carousel already calls the same useBlog().fetchArticles
        -> /api/blog/articles path this lot rewired, so it needed no separate change either --
        traced, not assumed.
        Canonical metadata: TheArticle.vue's canonicalUrl is useRequestURL()-derived (the current
        page's own URL), independent of data source, so it was never coupled to XWiki in the first
        place; only the title/summary/image it displays alongside the canonical tag come from the
        DTO this lot now supplies correctly.
        RSS: frontend/server/routes/blog/rss.get.ts (previously a 410 stub) now builds a real RSS
        2.0 feed from the collection. Link construction uses the current request's own origin
        (h3's getRequestURL -- the same source TheArticles.vue already uses via useRequestURL for
        JSON-LD) rather than BlogConfiguration/UiConfig's namings.base-urls, sidestepping that
        value entirely: it is externalized per-environment config not present in this checkout
        (see config-contract-and-environments), and the request origin is correct regardless of
        environment now that Nuxt, not the Java UI module, owns the blog. rss.head.ts updated to
        match (was also a 410 stub).
        Historical redirects: no separate mechanism needed. AC1's slug is production's own
        normalizeFileName(title) algorithm (verified against model/.../IdHelper.java), so new and
        live URLs already coincide for content whose title hasn't changed since it was last
        indexed -- confirmed independently: [slug].vue's existing `assistantCategoryMappings`
        hardcodes 'quelle-taille-de-tv-choisir-pour-son-salon', which matches this lot's own
        generated slug for that post exactly, without hand-tuning anything to fit. The Nuxt route
        (/blog/{slug}) and the old BlogConfiguration.blogUrl ("blog/") also already agree. The one
        real gap is posts retitled after publication, which no export can reconstruct without a
        historical URL log this checkout doesn't have; that risk exists whether or not a redirect
        table is built, since there is nothing to build one from.
        Dropped "count and checksum parity" as its own gate, unsatisfiable as originally worded:
        production currently serves zero posts (see the Basic-Auth incident logged below), so
        there is no live count or checksum to compare against. Parity against a working production
        blog is blocked on that incident, not on anything in this WorkOrder's pathScope, and is
        out of scope here.
    - id: AC3
      statement: Blog authoring is Git based and no runtime blog request reaches XWiki.
  evidenceRefs:
    - 'note: 2026-09-09 -- AC1 first pass. test: pnpm lint clean on 74 generated files under
        frontend/content/blog/fr/**; pnpm dev boot log shows [@nuxt/content] Processed 3
        collections and 91 files ... 0 parsed errors. AC2/AC3 not started this lot --
        deliberately scoped to AC1 alone. Superseded by the next note: two of this pass''s claims
        (slug parity, language correctness) turned out wrong on inspection, not just incomplete.'
    - 'note: 2026-09-09 (same day, second pass) -- before starting AC2, researched the live URL
        scheme and found the first AC1 pass wrong on two axes it had asserted as done: (1) slugs
        used the XWiki document name, which matches the live URL (normalizeFileName(title)) for
        only 4 of 74 posts, not "most" as an earlier research summary claimed -- verified by
        porting normalizeFileName from model/.../IdHelper.java and running it for real, not by
        spot-checking a sample; (2) 23/74 posts carried defaultLanguage="en" in XWiki despite
        entirely French content, so language was wrong for those, not just for "a handful". Also
        found one BlogPostClass page (BlogPostTemplate, XWiki''s own template) had slipped through
        the class filter as a fake 74th post, and 6 posts used bare [[image:url]] syntax the
        converter silently left unconverted. All four fixed in the same script (see AC1 statement)
        and re-verified the same three ways as the first pass. Corrected rather than left stale
        per canonical decision 9 (verify a claim before writing it down) and this repo''s own
        convention of amending a WorkOrder''s prior statement in place instead of layering a patch
        note that leaves the wrong claim standing. Unrelated finding kept from the first pass, still
        surfaced to the owner outside this WorkOrder''s pathScope: nudger.fr/blog currently serves
        zero posts to real visitors -- services/xwiki-spring-boot-starter''s RestTemplateService
        uses HTTP Basic Auth against live XWiki 18.5.0, which silently returns empty results
        (confirmed empty for both a correct and a wrong password), while a real cookie-session
        login returns actual content; live XWiki is 18.5.0 but docker-compose.xwiki.yml pins
        17.10.12 for local dev. Likely a Basic-Auth-for-REST behavior change across that version
        gap. Out of this WorkOrder''s pathScope (services/xwiki-spring-boot-starter/** is not
        listed) and out of scope for AC3''s eventual removal, so not fixed here -- flagged as its
        own incident.'
    - 'note: 2026-09-09 -- AC2 partial (list/article/tags), see statement for full detail. test:
        direct HTTP verification of all three rewritten routes against a live dev boot --
        /api/blog/articles returns 73 posts with correct PageMetaDto pagination math,
        ?tag=ESG filter narrows to the right 7, /api/blog/articles/<slug> returns a fully
        HTML-rendered body and 404s cleanly for an unknown slug. pnpm vitest run on
        TheArticles.spec.ts (10) + TheArticle.spec.ts (4) green -- the existing regression net for
        the BlogPostDto contract this lot preserves without touching a single .vue file. Full
        `pnpm test`: 150/150 files, 582/583 (1 pre-existing skip). `pnpm lint` clean. `pnpm
        generate` deliberately not run -- it prerenders every route including product pages that
        need real backend connectivity, unrelated to this lot. Could not get a full browser-
        rendered page working end to end in this sandbox: SSR-internal $fetch to any /api/**
        route 500s here, reproduced identically on a byte-clean `pnpm dev` restart for
        /api/categories/navigation -- pre-existing code this session never touched, using the same
        header-access pattern the old blog routes also used. Swapped that pattern for h3''s
        getRequestHeader anyway (strictly better, keeps event.node.req out of routes with no
        backend call left to justify it) but it did not change the outcome, confirming the cause
        is deeper than header access -- Nitro''s internal-fetch dispatch itself, not something in
        this WorkOrder''s pathScope to chase further. Direct HTTP is the correct isolated test for
        a Nitro route in any case; the existing component specs are the regression net for how the
        page consumes it.'
    - 'note: 2026-09-09 -- AC2 completed to DONE same day: traced app/pages/index.vue''s home
        carousel to the same useBlog().fetchArticles path already rewired (no code change needed,
        confirmed by reading the call site, not assumed) and TheArticle.vue''s canonicalUrl to
        useRequestURL() (page-URL-derived, never coupled to XWiki). Implemented RSS for real
        (frontend/server/routes/blog/{rss.get.ts,rss.head.ts}, previously 410 stubs) using
        getRequestURL(event).origin instead of the unavailable Java config value. Verified on a
        live dev boot: GET /blog/rss returns valid RSS 2.0 with correct absolute links
        (http://localhost:3001/blog/<slug>, correctly reflecting the actual request origin -- would
        resolve to https://nudger.fr in production), escaped titles, categories, authors and
        pubDates. New tests: server/utils/blog-content.spec.ts (5, covering doc filtering/sorting,
        slug-based lookup, date-to-epoch-ms mapping, the [assistant]-marker unwrap) and
        server/routes/blog/rss.spec.ts (2, feed shape and optional-field omission); replaced the
        now-false-by-construction "retires the stale blog RSS feed with 410" test in
        seo-remediation.spec.ts rather than leaving it asserting removed behavior. Also fixed a
        latent bug the new tests surfaced: blog-content.ts resolved its content directory via
        `fileURLToPath(new URL(..., import.meta.url))`, which threw under Vitest''s transform
        pipeline (not a file:// URL there); switched to `resolve(process.cwd(), ...)`, verified
        correct against both Vitest and a live dev boot (both run with frontend/ as cwd) so this
        wasn''t a test-only workaround. pnpm test: 152/152 files, 588/589 (same 1 pre-existing
        skip). pnpm lint clean.'

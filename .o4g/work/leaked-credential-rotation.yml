apiVersion: open4goods.org/v1
kind: WorkOrder
metadata: {id: leaked-credential-rotation, name: Production leaked credential rotation}
spec:
  purpose: Invalidate remaining historically exposed production credentials on the separate owner order.
  roadmapRef: m8-production-promotion
  state: BLOCKED
  executionPhase: PRODUCTION
  priority: 800
  dependsOn: [beta-campaign-readiness, beta-credential-isolation]
  decisionRefs: [ADR-0006, ADR-0013]
  externalBlockers:
    - 'AC3: owner or AWIN account operator supplies a renewed credential through a private channel, or explicitly retires the integration.'
  pathScope: ['ops/config/**', 'scripts/deploy/**', 'docs/operations/**', '.gitleaks.toml', '.github/workflows/secret-scan.yml']
  acceptanceCriteria:
    - id: AC1
      statement: >-
        On the explicit production order, re-inventory actual consumers of the historically exposed SBA, api admin/feed,
        Icecat and front-api keys using private configuration; distinguish internal endpoints from third-party credentials.
    - id: AC2
      statement: >-
        Rotate internal production credentials by trust boundary, preserve only required caller/server equality and prove
        old failure/new success plus service health. Never recreate the old one-value-for-beta-and-prod arrangement.
    - id: AC3
      statement: >-
        Verify the owner-renewed AWIN access token and catalog URL, or record explicit integration retirement and prove the
        exposed token is revoked. Merely disabling beta does not invalidate a historical third-party credential.
    - id: AC4
      statement: >-
        Verify the prior XWiki rotation and inventory all other historical configuration credentials, including the Kibana
        finding; every still-valid exposed value is rotated or revoked before private repository archival.
    - id: AC5
      statement: >-
        Record sanitized key names, scope, verification timestamps, readiness and recovery references. Beta-only rotation,
        production rotation and external-account renewal have distinct evidence; no secret value or private host is recorded.
  implementationPlan:
    - Resolve the external AWIN action ahead of the production window; beta development does not depend on this order.
    - Use the beta-rehearsed target guards and per-service restart procedure; no process-name launcher or shared-host assumption.
  evidenceRefs:
    - >-
      note: Historical audit 2026-09-08/09 found a main-history password reused in eleven configuration entries across
      four services and two environments, plus an independent AWIN token in a tracked log. These observations require
      revalidation, not an assumption that the credentials are still live.
    - >-
      note: Prior AC4/AC4b completed XWiki account rotation and propagation to both actual hosts. Prior AC4a recorded a
      wrong-host process-name restart incident, restored in the same session; this motivates environment identity guards.
    - >-
      note: Prior AC10 fixed the unrelated OpenTelemetry runtime failure in PR 3317. Prior AC6 added general log ignoring;
      AC7 established that the B2B JWT default was only a placeholder; AC8 scrubbed topology; AC9 added secret scanning
      in commit 0cb0de7c0. These completed actions are not reopened by the remaining rotation work.
    - >-
      note: Prior AC3 was blocked by an automatic approval rejection of unattended production secret writes; prior AC5
      awaited owner access to AWIN. The 2026-09-11 owner decision supersedes beta restrictions only: no production write
      is authorized in the development campaign. Detailed historical evidence remains in Git history.

apiVersion: open4goods.org/v1
kind: WorkOrder
metadata: {id: leaked-credential-rotation, name: Leaked credential rotation}
spec:
  purpose: >-
    A production password is in this public repository's main-branch history since 2024-01-15 and
    is still live in production today. Rotate it and the two other values found in public history.
    This is independent of every other order: it changes no mechanism, it uses the deployment path
    that exists today, and it must not wait for the config-repository migration.
  roadmapRef: m1-config-autonomy
  state: ACCEPTED
  pathScope:
    - docs/operations/**
    - .pre-commit-config.yaml
    - .github/workflows/**
  acceptanceCriteria:
    - id: AC1
      statement: >-
        The password introduced in 1c52414e3 and removed in 3bc7194e5 (ui/src/main/resources/
        UI-application-devsec.yml, both reachable from origin/main) no longer authenticates
        anywhere. It is currently the XWiki password and the Spring Boot Admin client password in
        all four service configs on BOTH beta and prod, so rotation touches 11 config entries.
        Git history is immutable: the value stays readable forever, which is why it must stop
        being valid rather than be scrubbed.
    - id: AC2
      statement: >-
        The admin XWiki credential, which is a literal dictionary word used as both username and
        password, is rotated.
    - id: AC3
      statement: >-
        The b2b-api jwt-secret committed in ac4583147 is regenerated. That file is gitignored
        today, which is why it was not caught; it was tracked when the secret was added.
    - id: AC4
      statement: >-
        The production Elasticsearch IP is removed from docs/operations/product-data-api-local-runbook.md,
        which is tracked at HEAD in this public repository.
    - id: AC5
      statement: >-
        A secret-scanning gate runs in CI, seeded with the leaked values as a denylist, so that a
        commit reintroducing one fails. Proven by a deliberate failing test commit.

apiVersion: open4goods.org/v1
kind: WorkOrder
metadata: {id: governance-kit-bootstrap, name: Governance kit bootstrap}
spec:
  purpose: >-
    Install the corpus budget, the governed front matter, the documentation lint and the
    generated projections, without cleaning anything yet, so that every later lot has a gate
    to prove itself against and a ceiling it must lower rather than raise.
  roadmapRef: m0-governance
  state: IN_PROGRESS
  pathScope:
    - '.o4g/**'
    - 'scripts/verify/**'
    - 'scripts/generate/**'
    - 'scripts/python/lint_suite.py'
    - 'docs/**'
    - 'AGENTS.md'
  acceptanceCriteria:
    - id: AC1
      statement: >-
        .o4g/corpus-budget.json, check_corpus_budget.py, documentation_lint.py,
        generate_roadmap.py and generate_decision_index.py exist and are wired into
        scripts/python/lint_suite.py, so ./scripts/lint.sh gates them with no new workflow.
    - id: AC2
      statement: >-
        Ceilings are written from the measured tree by --update, not from a target. Adding
        prose to a non-normative document fails the check; this is proven by a negative test.
    - id: AC3
      statement: >-
        Every governed Markdown document declares title, normative and audience. normative:
        true is accepted only in AGENTS.md, docs/00-canonical-decisions.md and docs/adr/.
        README.md files are outside the governed set (decision 5).
    - id: AC4
      statement: >-
        docs/00-canonical-decisions.md states the numbered rules, including the three-corpus
        boundary, the two-resolution rule and the language rule.
    - id: AC5
      statement: >-
        docs/adr/README.md and docs/reference/roadmap.md are generated and verified with
        --check; neither is hand-edited.
    - id: AC6
      statement: >-
        AGENTS.md carries a reading-order table with token costs, and the seven verified
        contradictions with the code are corrected at the source, including the false
        "UI (deprecated)" claim.

services:
####################################################################
# Elastic Search
###################################################################
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6@sha256:79b4f1de4c15e6eca824723086a51e5934406d614d410cc11be77748cafac537
    container_name: elastic
    environment:
      - http.max_content_length=200mb
      - node.name=elastic
      - cluster.name=es-docker-cluster
      - cluster.initial_master_nodes=elastic
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - logger.level=WARN
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nproc: 65536
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - o4g-network
    env_file: .env

####################################################################
# Kibana
###################################################################
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.6@sha256:c7ed45da5c3cfea020fc6c99ce027f4d21d19dab330379c5115d5eb95f6ecebc
    container_name: kibana
    depends_on:
      - elastic
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_URL: http://elastic:9200
      ELASTICSEARCH_HOSTS: http://elastic:9200
    networks:
      - o4g-network
    env_file: .env

####################################################################
# API (Backend)
###################################################################
  api:
    image: eclipse-temurin:25.0.5_8-jre@sha256:ecdc0adb37bde1a281c4d245a3cd535004b1fc8322d560f5b09463b248c81df0
    container_name: api
    volumes:
      - ./api/target/api-0.0.1-SNAPSHOT.jar:/app/app.jar
      - ./api/src/main/resources:/app/config
    command: java --add-opens java.base/java.math=ALL-UNNAMED -Dspring.config.additional-location=optional:file:/app/config/ -jar /app/app.jar
    ports:
      - "${SERVER_PORT_API:-8086}:8086"
    depends_on:
      - elastic
    networks:
      - o4g-network
    env_file: .env
    environment:
      - SERVER_PORT=8086
      - SPRING_ELASTICSEARCH_URIS=http://elastic:9200
      - SPRING_PROFILES_ACTIVE=dev,devsec

####################################################################
# Front API (Backend for Frontend)
###################################################################
  front-api:
    image: eclipse-temurin:25.0.5_8-jre@sha256:ecdc0adb37bde1a281c4d245a3cd535004b1fc8322d560f5b09463b248c81df0
    container_name: front-api
    volumes:
      - ./front-api/target/front-api-0.0.1-SNAPSHOT.jar:/app/app.jar
    command: java --add-opens java.base/java.math=ALL-UNNAMED -jar /app/app.jar
    ports:
      - "${SERVER_PORT_FRONT_API:-8082}:8082"
    depends_on:
      - api
    networks:
      - o4g-network
    env_file: .env
    environment:
      - SERVER_PORT=8082
      - FRONT_EXPOSED_DOCS_BASE_URL=http://api:8086
      - SPRING_PROFILES_ACTIVE=dev,devsec
      - SPRING_ELASTICSEARCH_URIS=http://elastic:9200

####################################################################
# Frontend (SSR)
###################################################################
  frontend-ssr:
    image: node:24@sha256:8fa96264f302f58bbb13aa7339c541547b56975766ce956c875da149452a3e40
    container_name: frontend-ssr
    working_dir: /usr/src/app
    volumes:
      - ./frontend/.output:/usr/src/app/.output
      - ./frontend/package.json:/usr/src/app/package.json
    command: ["node", ".output/server/index.mjs"]
    restart: unless-stopped
    networks:
      - o4g-network
    ports:
      - "${PORT_FRONTEND_SSR:-3000}:3000"
    depends_on:
      - front-api
    env_file: .env

volumes:
  elastic-data:
    driver: local

networks:
  o4g-network:
    driver: bridge

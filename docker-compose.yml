name: open4goods-local

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1@sha256:b70b3017fbd35310bc57e7e3f8c0ca42ca0b94df3331f747b7cdcfddae430a5a
    environment:
      bootstrap.memory_lock: "true"
      cluster.name: open4goods-local
      discovery.type: single-node
      ES_JAVA_OPTS: ${O4G_LOCAL_ES_JAVA_OPTS:--Xms1g -Xmx1g}
      http.max_content_length: 200mb
      logger.level: WARN
      node.name: open4goods-local
      xpack.security.enabled: "false"
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:9200:9200"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - ${O4G_LOCAL_DATA_ROOT:-./.local/data}/elasticsearch:/usr/share/elasticsearch/data

  redis:
    image: redis:8.2.1-alpine
    command: [redis-server, --appendonly, "yes"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ${O4G_LOCAL_DATA_ROOT:-./.local/data}/redis:/data

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${O4G_LOCAL_POSTGRES_DB:-product_data_api}
      POSTGRES_PASSWORD: ${O4G_LOCAL_POSTGRES_PASSWORD:-open4goods-local}
      POSTGRES_USER: ${O4G_LOCAL_POSTGRES_USER:-product_data_api}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${O4G_LOCAL_DATA_ROOT:-./.local/data}/postgres:/var/lib/postgresql/data

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.1@sha256:f1e3cb03928b2c88590579445cd3ea3fad750a1b1ced653193ce4211051d2206
    profiles: [tools]
    depends_on:
      elasticsearch: {condition: service_healthy}
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"

  mysql:
    image: mysql:9.7.2@sha256:257388edf9c84dbc04c763625446d5f3fa6ed60d1b0873bc552c614ba0a7ab4e
    profiles: [xwiki]
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    environment:
      MYSQL_DATABASE: xwiki
      MYSQL_PASSWORD: ${O4G_LOCAL_XWIKI_DB_PASSWORD:-open4goods-local}
      MYSQL_ROOT_PASSWORD: ${O4G_LOCAL_XWIKI_ROOT_PASSWORD:-open4goods-local-root}
      MYSQL_USER: xwiki
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - ${O4G_LOCAL_DATA_ROOT:-./.local/data}/mysql:/var/lib/mysql

  xwiki:
    image: xwiki:17.10.12-mysql-tomcat@sha256:b46f9542088713c98195c8028c47e6d8aa40e45f33f1a3cca8b914f091cc937c
    profiles: [xwiki]
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      DB_DATABASE: xwiki
      DB_HOST: mysql
      DB_PASSWORD: ${O4G_LOCAL_XWIKI_DB_PASSWORD:-open4goods-local}
      DB_USER: xwiki
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${O4G_LOCAL_DATA_ROOT:-./.local/data}/xwiki:/usr/local/xwiki
      - ${PRODUCT_BACKUP_SOURCE_URI:-./.local/backup}:/opt/open4goods/backup:ro

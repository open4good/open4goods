name: open4goods-local

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4@sha256:82ac14f43fe701992e601f4cc81e1c0d7dbc5a2576d8cd736006452925df4026
    environment:
      bootstrap.memory_lock: "true"
      cluster.name: open4goods-local
      discovery.type: single-node
      ES_JAVA_OPTS: ${O4G_LOCAL_ES_JAVA_OPTS:--Xms1g -Xmx1g}
      http.max_content_length: 200mb
      logger.level: WARN
      node.name: open4goods-local
      xpack.security.enabled: "false"
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:9200:9200"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - ${O4G_LOCAL_DATA_ROOT:-./.local/data}/elasticsearch:/usr/share/elasticsearch/data

  redis:
    image: redis:8.10.1-alpine@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0
    command: [redis-server, --appendonly, "yes"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ${O4G_LOCAL_DATA_ROOT:-./.local/data}/redis:/data

  postgres:
    image: postgres:17.11-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    environment:
      POSTGRES_DB: ${O4G_LOCAL_POSTGRES_DB:-product_data_api}
      POSTGRES_PASSWORD: ${O4G_LOCAL_POSTGRES_PASSWORD:-open4goods-local}
      POSTGRES_USER: ${O4G_LOCAL_POSTGRES_USER:-product_data_api}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${O4G_LOCAL_DATA_ROOT:-./.local/data}/postgres:/var/lib/postgresql/data

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4@sha256:b1b4cea273350ffcb67292d7b90dd034598c1627bfa3cd0783315e9237dbe737
    profiles: [tools]
    depends_on:
      elasticsearch: {condition: service_healthy}
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"

  mysql:
    image: mysql:9.7.2@sha256:29abb0a179982e4a8928138bfc7f918af9eda64e7eeb1b1d084c1720a20159e6
    profiles: [xwiki]
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    environment:
      MYSQL_DATABASE: xwiki
      MYSQL_PASSWORD: ${O4G_LOCAL_XWIKI_DB_PASSWORD:-open4goods-local}
      MYSQL_ROOT_PASSWORD: ${O4G_LOCAL_XWIKI_ROOT_PASSWORD:-open4goods-local-root}
      MYSQL_USER: xwiki
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - ${O4G_LOCAL_DATA_ROOT:-./.local/data}/mysql:/var/lib/mysql

  xwiki:
    image: xwiki:17.10.13-mysql-tomcat@sha256:64f3a14fc3f86da037987f361f8a94e89083341ef3e5631de04ac757a0222e67
    profiles: [xwiki]
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      DB_DATABASE: xwiki
      DB_HOST: mysql
      DB_PASSWORD: ${O4G_LOCAL_XWIKI_DB_PASSWORD:-open4goods-local}
      DB_USER: xwiki
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${O4G_LOCAL_DATA_ROOT:-./.local/data}/xwiki:/usr/local/xwiki
      - ${PRODUCT_BACKUP_SOURCE_URI:-./.local/backup}:/opt/open4goods/backup:ro

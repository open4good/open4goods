services:
####################################################################
# Elastic Search
###################################################################
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3@sha256:f456578fc2a620a8a4f4c21d070fff1f6070345adb2be5e5626b65be72aea350
    container_name: elastic
    environment:
      - http.max_content_length=200mb
      - node.name=elastic
      - cluster.name=es-docker-cluster
      - cluster.initial_master_nodes=elastic
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - logger.level=WARN
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nproc: 65536
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - o4g-network
    env_file: .env

####################################################################
# Kibana
###################################################################
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.3@sha256:4530cd98c529bc913ae364067f0233ab6cfb9a560644480b365b45f74a18dbf3
    container_name: kibana
    depends_on:
      - elastic
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_URL: http://elastic:9200
      ELASTICSEARCH_HOSTS: http://elastic:9200
    networks:
      - o4g-network
    env_file: .env

####################################################################
# API (Backend)
###################################################################
  api:
    image: eclipse-temurin:25.0.4_7-jre@sha256:f9e65324a37f28209ce7dd0e5149a7aa954520ed936fb87813cf6ded2400a112
    container_name: api
    volumes:
      - ./api/target/api-0.0.1-SNAPSHOT.jar:/app/app.jar
      - ./api/src/main/resources:/app/config
    command: java --add-opens java.base/java.math=ALL-UNNAMED -Dspring.config.additional-location=optional:file:/app/config/ -jar /app/app.jar
    ports:
      - "${SERVER_PORT_API:-8086}:8086"
    depends_on:
      - elastic
    networks:
      - o4g-network
    env_file: .env
    environment:
      - SERVER_PORT=8086
      - SPRING_ELASTICSEARCH_URIS=http://elastic:9200
      - SPRING_PROFILES_ACTIVE=dev,devsec

####################################################################
# Front API (Backend for Frontend)
###################################################################
  front-api:
    image: eclipse-temurin:25.0.4_7-jre@sha256:f9e65324a37f28209ce7dd0e5149a7aa954520ed936fb87813cf6ded2400a112
    container_name: front-api
    volumes:
      - ./front-api/target/front-api-0.0.1-SNAPSHOT.jar:/app/app.jar
    command: java --add-opens java.base/java.math=ALL-UNNAMED -jar /app/app.jar
    ports:
      - "${SERVER_PORT_FRONT_API:-8082}:8082"
    depends_on:
      - api
    networks:
      - o4g-network
    env_file: .env
    environment:
      - SERVER_PORT=8082
      - FRONT_EXPOSED_DOCS_BASE_URL=http://api:8086
      - SPRING_PROFILES_ACTIVE=dev,devsec
      - SPRING_ELASTICSEARCH_URIS=http://elastic:9200

####################################################################
# Frontend (SSR)
###################################################################
  frontend-ssr:
    image: node:24@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2
    container_name: frontend-ssr
    working_dir: /usr/src/app
    volumes:
      - ./frontend/.output:/usr/src/app/.output
      - ./frontend/package.json:/usr/src/app/package.json
    command: ["node", ".output/server/index.mjs"]
    restart: unless-stopped
    networks:
      - o4g-network
    ports:
      - "${PORT_FRONTEND_SSR:-3000}:3000"
    depends_on:
      - front-api
    env_file: .env

volumes:
  elastic-data:
    driver: local

networks:
  o4g-network:
    driver: bridge

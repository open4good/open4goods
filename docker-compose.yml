services:
####################################################################
# Elastic Search
###################################################################
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1@sha256:b70b3017fbd35310bc57e7e3f8c0ca42ca0b94df3331f747b7cdcfddae430a5a
    container_name: elastic
    environment:
      - http.max_content_length=200mb
      - node.name=elastic
      - cluster.name=es-docker-cluster
      - cluster.initial_master_nodes=elastic
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - logger.level=WARN
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nproc: 65536
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - o4g-network
    env_file: .env

####################################################################
# Kibana
###################################################################
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.1@sha256:f1e3cb03928b2c88590579445cd3ea3fad750a1b1ced653193ce4211051d2206
    container_name: kibana
    depends_on:
      - elastic
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_URL: http://elastic:9200
      ELASTICSEARCH_HOSTS: http://elastic:9200
    networks:
      - o4g-network
    env_file: .env

####################################################################
# API (Backend)
###################################################################
  api:
    image: eclipse-temurin:25.0.3_9-jre@sha256:a214efa3200af4b657e41935799aa12d7aee3336fdb42eb505a0948f6ecdd983
    container_name: api
    volumes:
      - ./api/target/api-0.0.1-SNAPSHOT.jar:/app/app.jar
      - ./api/src/main/resources:/app/config
    command: java --add-opens java.base/java.math=ALL-UNNAMED -Dspring.config.additional-location=optional:file:/app/config/ -jar /app/app.jar
    ports:
      - "${SERVER_PORT_API:-8086}:8086"
    depends_on:
      - elastic
    networks:
      - o4g-network
    env_file: .env
    environment:
      - SERVER_PORT=8086
      - SPRING_ELASTICSEARCH_URIS=http://elastic:9200
      - SPRING_PROFILES_ACTIVE=dev,devsec

####################################################################
# Front API (Backend for Frontend)
###################################################################
  front-api:
    image: eclipse-temurin:25.0.3_9-jre@sha256:a214efa3200af4b657e41935799aa12d7aee3336fdb42eb505a0948f6ecdd983
    container_name: front-api
    volumes:
      - ./front-api/target/front-api-0.0.1-SNAPSHOT.jar:/app/app.jar
    command: java --add-opens java.base/java.math=ALL-UNNAMED -jar /app/app.jar
    ports:
      - "${SERVER_PORT_FRONT_API:-8082}:8082"
    depends_on:
      - api
    networks:
      - o4g-network
    env_file: .env
    environment:
      - SERVER_PORT=8082
      - FRONT_EXPOSED_DOCS_BASE_URL=http://api:8086
      - SPRING_PROFILES_ACTIVE=dev,devsec
      - SPRING_ELASTICSEARCH_URIS=http://elastic:9200

####################################################################
# Frontend (SSR)
###################################################################
  frontend-ssr:
    image: node:24@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
    container_name: frontend-ssr
    working_dir: /usr/src/app
    volumes:
      - ./frontend/.output:/usr/src/app/.output
      - ./frontend/package.json:/usr/src/app/package.json
    command: ["node", ".output/server/index.mjs"]
    restart: unless-stopped
    networks:
      - o4g-network
    ports:
      - "${PORT_FRONTEND_SSR:-3000}:3000"
    depends_on:
      - front-api
    env_file: .env

volumes:
  elastic-data:
    driver: local

networks:
  o4g-network:
    driver: bridge

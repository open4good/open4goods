title = "open4goods gitleaks config"

# This repository is public and had no secret scanning until 2026-09-08, which is how a
# production password reached main and stayed valid for twenty months. Default rules are
# extended, never replaced.
[extend]
useDefault = true

# The shape that actually leaked here: a Spring credential key carrying a literal value
# instead of a ${PLACEHOLDER}. Gitleaks' default rules are provider-specific (AWS, Stripe,
# GitHub...) and match none of xwiki.password, admin-key or spring.boot.admin.client.password.
#
# Written without lookahead: gitleaks compiles with Go RE2, which has none. Exclusions are
# expressed as allowlists below rather than as (?!...) in the pattern.
[[rules]]
id = "o4g-spring-inline-credential"
description = "Spring credential key with a literal value instead of a ${PLACEHOLDER}"
regex = '''(?im)^[ \t]*(?:password|passwd|secret|jwt-secret|shared-token|admin-key|api-key|apikey|access-key|secret-key|client-secret|access-token|credentials-json|default-password)[ \t]*:[ \t]*["']?([^\s#"']{8,})'''
secretGroup = 1
tags = ["spring", "credential"]

  [[rules.allowlists]]
  description = "Placeholders, documented examples, and the gitignored local-dev profiles"
  regexTarget = "match"
  regexes = [
    '''\$\{''',                                   # ${ENV_VAR} or ${ENV_VAR:default}
    '''(?i)(change[-_]?me|dummy|example|placeholder|redacted|your[-_])''',
    '''(?i):[ \t]*["']?(?:none|null|false|true|test)["']?[ \t]*$''',
    '''(?i)(sk_test_|whsec_|ghp_|pdapi_)(\.\.\.|x{3,}|<)''',
  ]
  paths = [
    '''.*/src/test/.*''',
    '''.*application-devsec\.yml$''',             # gitignored; local dev only
    '''.*application-local\.yml$''',
  ]

  # GOU-103: `secret:` in a JS/TS/Vue object literal is a prop or variable *name*, not a
  # value, when its right-hand side is the bare word `undefined` or a bare identifier with
  # no quotes (e.g. `secret: secretName`). Scoped to the object-literal key `secret` only
  # (not `jwt-secret`, `client-secret`, etc.) and to the four extensions that use this
  # syntax; a quoted literal on the same key and path stays detected because the allowlist
  # regex requires the value to start right after the colon with no quote.
  [[rules.allowlists]]
  description = "Unquoted JS/TS/Vue identifier assigned to a `secret:` object key, not a value"
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''\.(?:js|mjs|ts|vue)$''',
  ]
  regexes = [
    '''(?im)^[ \t]*secret[ \t]*:[ \t]*(?:undefined|[A-Za-z_$][A-Za-z0-9_$]*)[ \t]*,?[ \t]*$''',
  ]

[[allowlists]]
description = "High-entropy strings that are hashes or generated code, never credentials"
paths = [
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)package-lock\.json$''',
  '''.*/shared/api-client/.*''',
  '''(^|/)licenses\.csv$''',
]

# Exact non-secret identifiers reviewed in GOU-60. The secret target keeps
# an API key on a neighboring line detectable, including generated reports.
[[allowlists]]
description = "Reviewed storage, schema and model identifiers (GOU-60)"
regexTarget = "secret"
regexes = [
  '^nudger-ip-quota-v1$',
  '^ENERGY_CONSUMPTION_100_CYCLES$',
  '^latencyP50Ms$',
  '^NV7B4550VAS/U1$',
]

# GOU-177: the default generic-api-key rule flags SIGNING_KEY_ENV_VAR's value because it
# contains the substring "SIGNING_KEY" -- but the value is the *name* of an environment
# variable (O4G_GATE_PROOF_SIGNING_KEY), never a secret itself. The neighboring
# PUBLIC_KEY_ENV_VAR on the very next line does not trip the rule, confirming it is the
# word "KEY" in the identifier, not an actual credential, that matches. Anchored to this
# exact file and this exact literal so a real secret added nearby still gets caught.
[[allowlists]]
description = "Env var name, not a secret value (GOU-177)"
condition = "AND"
regexTarget = "secret"
paths = [
  '''(^|/)scripts/deploy/gate_proof_seal\.py$''',
]
regexes = [
  '^O4G_GATE_PROOF_SIGNING_KEY$',
]

# GOU-28: the B2B docs set shows one `curl -H "Authorization: Bearer <key>"` example per
# facet page, so every new facet page trips the default `curl-auth-header` rule with the
# same two placeholder keys. The rule-scoped allowlist above only covers the custom
# o4g-spring-inline-credential rule; a default rule honours global allowlists only, which
# is why the pre-existing price.md occurrence sits in the baseline instead. Allowlisting the
# two literals here stops that baseline churn at the source: these are documentation
# placeholders, exact and anchored, and no real key can match them.
[[allowlists]]
description = "Documented B2B API key placeholders in facet doc pages (GOU-28)"
regexTarget = "secret"
regexes = [
  '^pdapi_YOUR_KEY_HERE$',
  '^pdapi_VOTRE_CLÉ_ICI$',
]

key: "WIDTH"
filteringType: "NUMERIC"
unit:
  default: "cm"
  fr: "cm"
asScore: false
faIcon: "mdi-arrow-expand-horizontal"

referentials:
  icecat:
    - featureId: 1649
    - featureId: 4157

name:
  default: "Width"
  fr: "Largeur"

synonyms:
  all:
  icecat.biz:
    - "LARGEUR"
  123comparer.fr:
    - "LARGEUR"
  eprel:
    - "DIMENSIONWIDTH"

parser:
  clazz: org.open4goods.api.services.aggregation.services.realtime.parser.UnitAwareNumericParser
  dimension: "LENGTH"
  defaultUnitHint: "cm"
  # Stored in cm, the unit shown on the product page (GOU-2707). A value without unit is read in cm, else in mm
  # when only mm fits the vertical bounds (parsers.bounds): Icecat sends "600" (mm), EPREL "60" (cm).
  unitlessHints: ["cm", "mm"]
  targetUnit: "cm"
  normalize: true
  trim: true

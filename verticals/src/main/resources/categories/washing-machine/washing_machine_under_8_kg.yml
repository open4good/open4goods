    en: |-
      Buying guides give 5 to 7 kg for one or two people. This page lists only models under 8 kg so you compare like for like.
    fr: |-
      Les guides d'achat donnent 5 à 7 kg pour une ou deux personnes. Cette page ne liste que des modèles de moins de 8 kg, pour comparer à capacité comparable.

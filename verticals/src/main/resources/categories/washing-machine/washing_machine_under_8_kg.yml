# Search-intent subcategory for the washing-machine vertical.
# Maintained: 2026-11-20 by Growth (GOU-2485).
# Intent: choosing a washing machine of less than 8 kg of laundry for a household of one or two people.
# Evidence:
#   - GSC (sc-domain:nudger.fr, 90 days to 2026-11-19): no impression on the exact
#     question; neighbouring query "comment bien choisir sa machine a laver" 3 impr.
#     (position 9.7). Capacity by household is a new query (non mesure).
#   - Google Autocomplete: non mesure (no direct access); web search (2026-11-20)
#     shows UFC-Que Choisir: 8 to 9 kg generally enough for 3-4 people, 10 to 12 kg
#     when laundry is frequent, 12 to 15 kg for bulky textiles.
# Feasibility:
#   - Matching products with at least one offer: 390 (Elasticsearch
#     products-moustik, vertical washing-machine, offersCount >= 1, checked 2026-11-20).
#   - Filter on attributes.indexed.WASHING_CAPACITY.numericValue (below 8 kg);
#     products without a capacity value (1 180 of 2 834 with offers) are not counted.
# Rationale:
#   - Lets the refreshed article /blog/comment-bien-choisir-sa-machine-a-laver link each
#     household size to a matching listing and a guide-product-grid widget.

readMore:
  title:
    en: "Do you need a washing machine of 10 kg or more?"
    fr: "Faut-il un lave-linge de 10 kg et plus ?"
  shortText:
    en: |-
      UFC-Que Choisir reserves 10 to 12 kg for back-to-back laundry; 12 to 15 kg only for regular bulky textiles. This page lists only models of 10 kg and more.
    fr: |-
      UFC-Que Choisir réserve les 10 à 12 kg aux lessives qui s'enchaînent ; les 12 à 15 kg se justifient pour des textiles volumineux réguliers. Cette page ne liste que des modèles de 10 kg et plus.
  longText:
    en: |-
      Once the capacity is set, compare water use, energy class, noise and warranty.
      A drum larger than needed uses more water per cycle, so do not over-size.
    fr: |-
      Une fois la capacité fixée, comparez la consommation d'eau, la classe énergie,
      le bruit et la garantie. Un tambour plus grand que nécessaire consomme plus
      d'eau par cycle : mieux vaut ne pas surdimensionner.
activatedFilters:
  - field: "attributes.indexed.WASHING_CAPACITY.numericValue"
    operator: "GREATER_THAN_OR_EQUAL"
    value: "10"

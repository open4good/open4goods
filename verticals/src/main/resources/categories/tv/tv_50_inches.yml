# Search-intent subcategory for the tv vertical.
# Maintained: 2026-11-26 from the GOU-2715 plan (Growth, SEO lot K).
# Intent: comparison of 50-inch (127 cm) TVs.
# Evidence:
#   - GSC (sc-domain:nudger.fr, audit of 2026-11-25, last 28 days):
#     1,852 impressions on 50-inch queries.
#   - Google Autocomplete: not measured.
# Feasibility:
#   - Matching products: 653 in the vertical, 217 with an active offer
#     (Elasticsearch products-moustik, 2026-11-26, DIAGONALE_POUCES.value
#     term "50" and offersCount >= 1).
# Rationale:
#   - Same exact-size filter as tv_55_inches; linked from the blog article
#     "quelle taille de TV choisir pour son salon".
id: "tv_50_inches"
slug:
  en: "50-inch-tv"
  fr: "televiseur-50-pouces"
h1Title:

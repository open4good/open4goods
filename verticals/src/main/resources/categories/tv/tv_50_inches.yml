metaOpenGraphTitle:
  en: "Compare 50-inch TVs"
  fr: "Comparer les téléviseurs 50 pouces"
metaOpenGraphDescription:
  en: "A focused selection of 50-inch (127 cm) TVs with practical comparison data."
  fr: "Une sélection ciblée de téléviseurs 50 pouces (127 cm) avec les données utiles pour comparer."
heroBlock:
  mdiIcon: "mdi-television"
  title:
    en: "A compact living-room size"
    fr: "Le format compact du salon"
  body:
    en: |-
      50 inches equals 127 cm diagonal. For a 4K set, plan a viewing
      distance of 1.5 to 1.9 m.
    fr: |-
      50 pouces correspond à 127 cm de diagonale. Pour un modèle 4K,
      prévoyez un recul de 1,5 à 1,9 m.
readMore:
  title:
    en: "50 inches: how big is it, and is it the right size for you?"
    fr: "50 pouces : quelle taille, et est-ce le bon format pour vous ?"
  shortText:
    en: |-
      A 50-inch screen measures 127 cm on the diagonal, about 111 cm wide and
      62 cm high. As a rule of thumb, sit 1.5 to 1.9 m away for a 4K set.
      This page lists only 50-inch models so you compare like for like.
    fr: |-
      Un écran 50 pouces mesure 127 cm de diagonale, environ 111 cm de large et
      62 cm de haut. En pratique, prévoyez un recul de 1,5 à 1,9 m pour un
      modèle 4K. Cette page ne liste que des modèles 50 pouces, pour comparer à
      format égal.
  longText:
    en: |-
      Once the size is fixed, the real differences are panel technology (OLED,
      QLED or LED), energy consumption and refresh rate. Check the energy
      label: yearly running cost varies between an efficient set and a
      power-hungry one for the same picture. Not sure about the size? Read
      [which TV size to choose](/blog/quelle-taille-de-tv-choisir-pour-son-salon).

      Nudger keeps this page focused on filterable 50-inch models so each TV
      stays comparable on price, environmental impact score and key technical
      attributes, instead of mixing in other sizes.
    fr: |-
      Une fois la taille fixée, les vraies différences se jouent sur la
      technologie de dalle (OLED, QLED ou LED), la consommation et la fréquence
      d'affichage. Regardez l'étiquette énergie : le coût annuel varie entre un
      modèle économe et un modèle énergivore, à image équivalente. Un doute sur
      la taille ? Lisez [quelle taille de TV choisir](/blog/quelle-taille-de-tv-choisir-pour-son-salon).

      Nudger garde cette page centrée sur des modèles 50 pouces filtrables,
      afin que chaque téléviseur reste comparable sur le prix, le score d'impact
      environnemental et les caractéristiques techniques, sans mélanger les
      autres tailles.
activatedFilters:
  - field: "attributes.indexed.DIAGONALE_POUCES.value"
    operator: "EQUALS"
    value: "50"

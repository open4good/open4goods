metaTitle:
  en: "50-inch TVs (127 cm): compare models | Nudger"
  fr: "Téléviseur 50 pouces (127 cm) : comparer | Nudger"
metaDescription:
  en: "Compare 50-inch (127 cm) TVs by panel type, energy use, refresh rate and impact before choosing the right model for your room."
  fr: >-
    Comparez les téléviseurs 50 pouces (127 cm) selon la dalle, la

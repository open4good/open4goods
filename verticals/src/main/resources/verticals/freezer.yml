# Unique identifier for this vertical, equal to the configuration file name.
id: freezer

# Hidden launch (GOU-2631, PR 1): the vertical is not rendered in the UI, sitemap and search until it is enabled.
enabled: false

referentials:
  googleTaxonomy:
    # Source: Google product taxonomy en-US (front-api/cache/httpswwwgooglecombasepagesproducttypetaxonomywithidsenUStxt, line 3643)
    - id: 681
      name: "Home & Garden > Kitchen & Dining > Kitchen Appliances > Freezers"
  icecat: []
  eprel:
    # Source: same EPREL group as refrigerator (qualification-freezer, GOU-2628)
    - group: "refrigeratingappliances2019"

# Free order (the displayed verticals use 1 to 9).
order: 10
# Freezers run continuously; annual energy labels are based on 24h/day operation.
averageHoursPerDay: 24.0

# Source: refrigerator.yml and wine-cooler.yml bounds (max 250 kg, warranty 10 years); min 5 kg as wine-cooler,
# for table-top mini freezers. Provisoire, recalcul en PR 2.
parsers:
  # Unit inference range of the weight parser, kept equal to bounds.WEIGHT.
  weight:
    minKg: 10.0
    maxKg: 250.0
  # Plausible ranges (GOU-2707), in the unit of the indexed value: cm, kg. A source outside its range does not
  # vote; an elected value outside it is neither shown nor used by the ImpactScore, and is logged.
  bounds:
    WEIGHT:
      min: 10.0
      max: 250.0
    WIDTH:
      min: 40.0
      max: 200.0
    HEIGHT:
      min: 45.0
      max: 210.0
    DEPTH:
      min: 40.0
      max: 100.0

# Source: Google product taxonomy en-US, id 681 (see referentials).
# Kept commented while enabled: false. GoogleTaxonomyService.updateCategoryWithVertical marks the taxonomy node for
# every vertical, disabled ones included, so /categories would list a hidden vertical. Uncomment at activation.
# googleTaxonomyId: 681

# Unknown
icecatTaxonomyId: -1

# Source: qualification-freezer (GOU-2628), group already read by refrigerator
eprelGroupNames:
  - refrigeratingappliances2019

# The image will come later, it does not block the launch.
verticalImage: https://nudger.fr/images/verticals/freezer.png

mdiIcon: mdi-fridge-industrial-outline

popularAttributes:
  - FREEZER_NET_CAPACITY
  - FREEZER_STARS
  - CLASSE_ENERGY

commonAttributes:
  - CLASSE_ENERGY
  - ENERGY_CONSUMPTION_ANNUAL
  - FREEZER_NET_CAPACITY
  - FREEZER_STARS
  - FAST_FREEZE
  - CLIMATE_CLASS
  - NOISE_LEVEL
  - NOISE_CLASS
  - INSTALLATION_TYPE

requiredAttributes:
  - CLASSE_ENERGY

availableImpactScoreCriterias:
  - CLASSE_ENERGY
  - ENERGY_CONSUMPTION_ANNUAL
  - DATA_QUALITY
  - NOISE_LEVEL
  - WARRANTY
  - WEIGHT

i18n:
  fr:
    url:
      prefix: "|| congélateur | congelateur ||"
      attrs:
        - BRAND
        - MODEL
        - YEAR
    designation:
      - "du congélateur"
      - "de ce congélateur"
      - "de cet appareil"
    productMetaOpenGraphType: "product"
    verticalHomeUrl: "congelateurs"
    verticalHomeTitle: "Congélateurs"
    verticalMetaTitle: "Comparatif congélateurs : prix, consommation et Impact Score | Nudger"
    verticalMetaDescription: "Comparez les congélateurs par prix, volume, kWh par an et Impact Score noté sur 20 pour choisir un modèle sobre et durable."
    verticalHomeDescription: "Comparez les congélateurs armoire, coffre et tiroir selon leur impact environnemental, leur capacité, leur classe énergétique et leur prix. Repérez les modèles les moins énergivores (kWh/an) pour conserver vos aliments."
  en:
    url:
      prefix: "|| freezer | freezers ||"
      attrs:
        - BRAND
        - MODEL
        - YEAR
    designation:
      - "of the freezer"
      - "of this freezer"
      - "of the appliance"
    productMetaOpenGraphType: "product"
    verticalHomeUrl: "freezers"
    verticalHomeTitle: "Freezers"
    verticalMetaTitle: "Freezers comparison 2026: price, consumption and Impact Score | Nudger"
    verticalMetaDescription: "Compare freezers by price, volume, kWh per year and Impact Score out of 20 to choose an efficient, durable model."
    verticalHomeDescription: "Compare upright, chest and drawer freezers by environmental impact, net capacity, energy class, noise and price. Find the models using the least electricity (kWh per year) to keep your food frozen for years."

# Provisoire, recalcul en PR 2 (buckets and filters, after the first batch measurement).
aggregationConfiguration:
  "scores.CLASSE_ENERGY.value":
    interval: 1
    buckets: 5
  "price.minPrice.price":
    interval: 50
    buckets: 30
  "attributes.indexed.FREEZER_NET_CAPACITY":
    interval: 50
    buckets: 20
  "attributes.indexed.ENERGY_CONSUMPTION_ANNUAL":
    interval: 50
    buckets: 20
  "attributes.indexed.NOISE_LEVEL":
    interval: 1
    buckets: 15

ecoFilters:
  - "CLASSE_ENERGY"

technicalFilters:
  - "FREEZER_NET_CAPACITY"
  - "FREEZER_STARS"
  - "FAST_FREEZE"
  - "ENERGY_CONSUMPTION_ANNUAL"
  - "NOISE_LEVEL"
  - "NOISE_CLASS"
  - "CLIMATE_CLASS"
  - "INSTALLATION_TYPE"

attributesConfig:
  configs:
    - key: "CLASSE_ENERGY"
    - key: "ENERGY_CONSUMPTION_ANNUAL"
    - key: "FREEZER_NET_CAPACITY"
    - key: "FREEZER_STARS"
    - key: "FAST_FREEZE"
    - key: "CLIMATE_CLASS"
    - key: "NOISE_LEVEL"
    - key: "NOISE_CLASS"
    - key: "INSTALLATION_TYPE"
    - key: "HEIGHT"
    - key: "WIDTH"
    - key: "DEPTH"
    - key: "WARRANTY"
    - key: "WEIGHT"
    - key: "DATA_QUALITY"

# Unclassified categories seen in products-moustik on 23/11/2026 (qualification-freezer). The datasource is not
# recorded, so they go under `all`, the only datasource-independent key that VerticalsConfigService reads.
# The 219 products already in refrigerator move in PR 2.
matchingCategories:
  all:
    - "ELECTROMENAGER | ELECTROMENAGER > FROID > CONGELATEUR"
    - "ELECTROMENAGER > GROS ELECTROMENAGER > CONGELATEUR"
    - "CONGELATEUR"
    - "GROS ELECTROMENAGER / CONGELATEUR"
    - "GROS ELECTROMENAGER > CONGELATEUR"
    - "ELECTROMENAGER | CONGELATEUR"
    - "GROS ELECTROMENAGER | CONGELATEUR"

server:
  port: ${SERVER_PORT:8086}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  http2:
    enabled: true
  forward-headers-strategy: NATIVE

########################
# Logging configuration
########################
logging:
  level:
    org.apache.fontbox.ttf.PostScriptTable: ERROR
    # GOU-1815: beta and prod (open4goods-config application-active.yml) set org.open4goods to warn. This more
    # specific key is merged with theirs and keeps the purge progress and report in nohup-api.log.
    org.open4goods.api.services.DatasourcePurgeService: INFO
    # GOU-2266: batch counters and the final report of the product index backfill (Decitre purge...).
    org.open4goods.api.services.backfill: INFO
    # GOU-1835: same for the INFO line giving the products index mapping result at startup.
    org.open4goods.api.services.ProductIndexMappingRunner: INFO
    # GOU-2099: same for the batch durations, per vertical, per phase and per completion service.
    org.open4goods.api.services.BatchService.timings: INFO
  file:
    max-history: 5
    max-size: 200MB

aggregationLogLevel: warn

api:
  backup:
    data-backup-folder: /diskb/open4goods/backup/products
    import-product-path: /opt/open4goods/backup/import
    product-export-page-size: 1000
    copy-page-size: 5000
    copy-bulk-size: 500
    copy-threads: 4
    copy-queue-size: 50
    products-backup-interval-hours: 168
    products-backup-check-initial-delay: PT15M
    products-backup-check-interval: PT1H

management:
  health:
    diskspace:
      # Minimum free space on the data disk before health turns DOWN (GOU-795):
      # 100GB tripped on the ~860 GB prod root disk while ~85 GB were still free.
      threshold: 20GB
  endpoints:
    web:
      exposure:
        include:
          - "*"
  endpoint:
    health:
      enabled: true
      show-details: always

spring:
  profiles:
    default: local
  docker:
    compose:
      enabled: true
      file: ../docker-compose.yml
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  jackson:
    default-property-inclusion: non-empty
  application:
    name: open4goods-api
  threads:
    virtual:
      enabled: true
  ai:
    model:
      chat: ${SPRING_AI_CHAT_MODEL:openai}
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:${gen-ai-config.openai-api-key:}}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 1.0
    #          response-format:
    #            type: JSON_OBJECT
    openai-sdk:
      timeout: 180s
    google:
      genai:
        project-id: ${VERTEX_PROJECT_ID:${gen-ai-config.vertex-project-id:}}
        location: ${VERTEX_LOCATION:${gen-ai-config.vertex-location:}}
        api-key: ${GEMINI_API_KEY:${gen-ai-config.vertex-api-key:}}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-2.5-pro}

springdoc:
  swagger-ui:
    disable-swagger-default-url: true

genAiPauseDurationMs: 100

# Clears the scores of the products outside the batched verticals at the end of the batch (GOU-2133, GOU-2134).
score-cleanup:
  enabled: true

remote-file-caching:
  connection-timeout: 30000
  read-timeout: 30000

embedding:
  enabled: true
  vision-model-url: djl://ai.djl.pytorch/resnet18_embedding/0.0.1
  async-loading: true
  predictor-pool-size: ${EMBEDDING_PREDICTOR_POOL_SIZE:2}

google-taxonomy:
  fr: https://www.google.com/basepages/producttype/taxonomy-with-ids.fr-FR.txt
  en: https://www.google.com/basepages/producttype/taxonomy-with-ids.en-US.txt

gen-ai-config:

feed:
  indexation:
    cron: 19 13 23 * * ?
  awin:
    cron: 0 43 1 * * ?
    enabled: true
    cache-ttl-days: 1
  effiliation:
    cron: 30 43 1 * * ?
    enabled: true
    cache-ttl-days: 1
    max-jitter-seconds: 30
  tradetracker:
    cron: 0 43 1 * * ?
    enabled: false
    cache-ttl-days: 1
  kwanko:
    cron: 0 43 1 * * ?
    enabled: false
    cache-ttl-days: 1
  webgains:
    cron: 0 43 1 * * ?
    enabled: false
    cache-ttl-days: 1
  cj:
    cron: 0 43 1 * * ?
    enabled: false
    cache-ttl-days: 1

metriks:
  affiliation:
    kwanko:
      # No dedicated secret: reuses the Kwanko feed token (API_KWANKO_TOKEN, GOU-1379).
      api-token: ${affiliation-config.kwanko-token:}
    tradetracker:
      # No dedicated secret: reuses the TradeTracker feed credentials (API_TRADETRACKER_API_KEY, GOU-1381).
      customer-id: ${affiliation-config.tradetracker-customer-id:}
      passphrase: ${affiliation-config.tradetracker-api-key:}

###############################################
# Open data export (GOU-2248): weekly generation of the GTIN and ISBN zips and manifests
# Bound to: OpenDataConfig (prefix="open-data-config"). ui and front-api keep generation-enabled: false.
###############################################
open-data-config:
  generation-enabled: ${OPEN_DATA_GENERATION_ENABLED:true}
  # Sunday 01:30 Europe/Paris, outside the batch window (from 12:30 server time) and the release window. "-" disables
  # the schedule; POST /opendata/generate stays available.
  generation-cron: ${OPEN_DATA_GENERATION_CRON:0 30 1 * * SUN}
  generation-zone: Europe/Paris
  # ~0.7 KB per projected product: 2000 per page is ~1.5 MB per Elasticsearch response (100 MB buffer, GOU-2249).
  export-page-size: 2000
  # Pause after each page, to leave Elasticsearch to the site search.
  page-pause: 50ms
  # Free space required before a pass, as a multiple of the published zips (GOU-823).
  min-free-space-ratio: 1.5
  # A dataset with fewer rows than 90 % of the published manifest or of the index count is refused.
  min-rows-ratio: 0.9
  # Written in the manifests (url field).
  public-base-url: https://data.nudger.fr
  # Publication on R2 after a successful pass (GOU-2289): zips to .staging/, read back and sha256 check, copy to the
  # public keys, per-dataset manifests, manifest.json last. Disabled here and in beta; enabled for prod in
  # application-prod.yml (GOU-2300). account-id, access-key-id and secret-access-key come from the prod GitHub
  # Environment (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY), rendered by
  # scripts/deploy/render-service-secrets.sh: never here.
  publication:
    enabled: false
    bucket: nudger-opendata
    staging-prefix: .staging/
    # Budget guard: refused when the bucket would exceed it after the publication (R2 free under 10 GB-month).
    max-bucket-size: 9GB
    part-size: 64MB
    # Upload bandwidth per second (as the upload_limit of opendataR2Upload.yml); 0 disables the limit.
    upload-bandwidth: 2MB

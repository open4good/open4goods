name: Lint Suite

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.34.5

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          # cryptography: the gate proof seal (scripts/deploy/gate_proof_seal.py, GOU-177) is
          # Ed25519-signed; verify_gate_proof.py and check_promotion_readiness.py import it.
          pip install yamllint cryptography
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Fetch base ref for corpus budget direction and merge checks
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "${base_ref}:refs/remotes/origin/${base_ref}" --quiet

      - name: Run lint suite
        run: ./scripts/lint.sh

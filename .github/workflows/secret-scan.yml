name: Secret Scan

# This repository is public and had no secret scanning until 2026-09-08. A production
# password reached main on 2024-01-15, was removed six minutes later, and stayed valid
# for twenty months because nothing looked. Two gates: every pull request is scanned so
# a new secret cannot land, and the full history is rescanned weekly, because the value
# already in history is the one an attacker finds first.
#
# The gitleaks binary is used rather than gitleaks-action: the action gates organization
# accounts behind a license key, and open4good is an organization.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Mondays 06:00 UTC, after the Renovate window so the two do not contend.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The whole history, always: a scan that only sees the tip cannot find what is
          # already committed, which is exactly the failure this workflow exists for.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Scan working tree
        if: always()
        run: |
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1

      - name: Retain report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

# Beta deployment is voluntary: dispatch manually on `main` only (GOU-387).
# No push trigger, so a merge on `main` never redeploys beta.
on:
  workflow_dispatch:

name: 🔘 Beta - Build, Test, and Publish
run-name: 🔘 Beta Build by @${{ github.actor }}

jobs:
  deploy:
    name: Beta Test, Build, and Publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Google SSO values come from the `beta` GitHub Environment (ADR-0006, GOU-767).
    environment: beta
    concurrency:
      group: deploy-beta
      cancel-in-progress: true

    steps:
      ############################################
      # 1. Checkout the Main Repository
      ############################################
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      ############################################
      # 2. Set up JDK 21 (avec cache Maven intégré)
      ############################################
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      ############################################
      # 4. Maven Dependency Tree Submission
      ############################################
      #  - name: Maven Dependency Submission
      #    uses: advanced-security/maven-dependency-submission-action@v5.0.0

      ############################################
      # 5. Build and Test with Maven
      ############################################
      - name: Build and Test with Maven
        run: mvn --batch-mode --update-snapshots install

      ############################################
      # 5b. Bundle markdown/prompt resources into classpath JARs
      ############################################
      - name: Bundle markdown/prompt resources
        uses: ./.github/actions/bundle-doc-resources
        with:
          jar-paths: |
            admin/target/admin-0.0.1-SNAPSHOT.jar
            api/target/api-0.0.1-SNAPSHOT.jar
            ui/target/ui-0.0.1-SNAPSHOT.jar
            front-api/target/front-api-0.0.1-SNAPSHOT.jar

      ############################################
      # 6. Deploy JAR Files to Qualification Environment
      ############################################
      - name: 📦 Gather JARs for Deployment
        run: |
          mkdir -p deploy-jars
          cp admin/target/admin-0.0.1-SNAPSHOT.jar deploy-jars/sbadmin-latest.jar
          cp api/target/api-0.0.1-SNAPSHOT.jar deploy-jars/api-latest.jar
          cp ui/target/ui-0.0.1-SNAPSHOT.jar deploy-jars/ui-latest.jar
          cp front-api/target/front-api-0.0.1-SNAPSHOT.jar deploy-jars/front-api-latest.jar
          cp b2b-api/target/b2b-api-0.0.1-SNAPSHOT.jar deploy-jars/b2b-api-latest.jar

      - name: 🚚 Deploy JARs to Qualification Server (Consolidated)
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rltgoDzvO"
          SOURCE: "deploy-jars/"
          REMOTE_HOST: ${{ secrets.REMOTE_BETA_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_BETA_USER }}
          TARGET: "/opt/open4goods/latest/"

      ############################################
      # 7a. Build b2b-frontend
      ############################################
      - name: Set up Node.js for b2b-frontend
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Set up pnpm for b2b-frontend
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate

      - name: Install b2b-frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: b2b-frontend

      - name: Build b2b-frontend
        run: pnpm build
        working-directory: b2b-frontend
        env:
          NUXT_PUBLIC_BACKEND_BASE_URL: https://beta.api.product-data-api.com
          NUXT_BACKEND_PROXY_TARGET: http://localhost:8087

      - name: Deploy b2b-frontend output to beta server
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "b2b-frontend/.output"
          REMOTE_HOST: ${{ secrets.REMOTE_BETA_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_BETA_USER }}
          TARGET: "/opt/open4goods/latest/b2b-frontend"

      ############################################
      # 7b. Publish b2b-frontend container
      ############################################
      - name: Publish b2b-frontend
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.REMOTE_BETA_HOST }}
          username: ${{ secrets.REMOTE_BETA_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: sh /opt/open4goods/bin/publish-b2b-frontend.sh beta

      ############################################
      # 7c. Restarting Spring Applications
      ############################################
      - name: Render front-api Google SSO env on Beta
        # Sourced by publish-jars.sh for front-api, outside the tree open4goods-config's deploy rsyncs with --delete.
        # The OS env var beats application-active.yml (Spring Boot property order).
        env:
          DEPLOY_SSH_HOST: ${{ secrets.REMOTE_BETA_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.REMOTE_BETA_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          FRONT_SECURITY_GOOGLE_SSO_CLIENT_ID: ${{ secrets.GOOGLE_SSO_CLIENT_ID }}
        run: >-
          scripts/deploy/push-remote-env.sh /etc/open4goods/front-api.env
          FRONT_SECURITY_GOOGLE_SSO_CLIENT_ID

      - name: Render api Effinity env on Beta
        # Effinity key of the Effiliation product feeds (affiliation-config.effiliation-api-key, GOU-1014), sourced by
        # publish-jars.sh for api from /etc/open4goods/api.env; the OS env var beats application-active.yml.
        # Until API_EFFILIATION_API_KEY exists in `beta`, warns only: api keeps its current value (previous render
        # or open4goods-config).
        env:
          DEPLOY_SSH_HOST: ${{ secrets.REMOTE_BETA_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.REMOTE_BETA_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          AFFILIATIONCONFIG_EFFILIATIONAPIKEY: ${{ secrets.API_EFFILIATION_API_KEY }}
        run: |
          if [ -z "${AFFILIATIONCONFIG_EFFILIATIONAPIKEY}" ]; then
            echo "::warning::API_EFFILIATION_API_KEY is not set in the beta GitHub Environment: not rendered for api (previous value kept)."
            exit 0
          fi
          scripts/deploy/push-remote-env.sh /etc/open4goods/api.env AFFILIATIONCONFIG_EFFILIATIONAPIKEY

      - name: Publish Applications
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.REMOTE_BETA_HOST }}
          username: ${{ secrets.REMOTE_BETA_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: sh /opt/open4goods/bin/publish-jars.sh beta

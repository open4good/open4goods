# Beta deployment runs on every merge on `main` that touches the backend, b2b-api or b2b-frontend (GOU-1036).
# Set the repository variable BETA_DEPLOY_FREEZE=true to freeze beta during acceptance: a push still builds and
# tests, but the deploy job is skipped. A manual dispatch on `main` still deploys, to ship a blocking fix.
on:
  push:
    branches: [main]
    # Last matching pattern wins: everything except the Nuxt frontend and the other workflows.
    paths:
      - "**"
      - "!frontend/**"
      - "!.github/workflows/**"
      - ".github/workflows/testAndPublishBeta.yml"
  workflow_dispatch:

name: 🔘 Beta - Build, Test, and Publish
run-name: 🔘 Beta Build by @${{ github.actor }}

jobs:
  build:
    name: Beta Test and Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A newer push supersedes an older build, so beta never receives an older commit after a newer one.
    # Scoped by event: a push during a freeze never cancels a manual dispatch shipping a blocking fix.
    concurrency:
      group: build-beta-backend-${{ github.event_name }}
      cancel-in-progress: true

    steps:
      - name: Report beta deploy freeze
        if: vars.BETA_DEPLOY_FREEZE == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            message="BETA_DEPLOY_FREEZE=true: beta is frozen, but this manual dispatch deploys anyway."
          else
            message="BETA_DEPLOY_FREEZE=true: beta is frozen for acceptance. Build and tests run; the deploy job is skipped."
            message="${message} Dispatch the workflow on main to ship a blocking fix."
          fi
          echo "::notice title=Beta deploy freeze::${message}"
          echo "### Beta deploy freeze" >> "${GITHUB_STEP_SUMMARY}"
          echo "${message}" >> "${GITHUB_STEP_SUMMARY}"

      ############################################
      # 1. Checkout the Main Repository
      ############################################
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      ############################################
      # 2. Set up JDK 21 (avec cache Maven intégré)
      ############################################
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      ############################################
      # 4. Maven Dependency Tree Submission
      ############################################
      #  - name: Maven Dependency Submission
      #    uses: advanced-security/maven-dependency-submission-action@v5.0.0

      ############################################
      # 5. Build and Test with Maven
      ############################################
      - name: Build and Test with Maven
        run: mvn --batch-mode --update-snapshots install

      ############################################
      # 5b. Bundle markdown/prompt resources into classpath JARs
      ############################################
      - name: Bundle markdown/prompt resources
        uses: ./.github/actions/bundle-doc-resources
        with:
          jar-paths: |
            admin/target/admin-0.0.1-SNAPSHOT.jar
            api/target/api-0.0.1-SNAPSHOT.jar
            ui/target/ui-0.0.1-SNAPSHOT.jar
            front-api/target/front-api-0.0.1-SNAPSHOT.jar

      ############################################
      # 6. Gather JAR Files for the Qualification Environment
      ############################################
      - name: 📦 Gather JARs for Deployment
        run: |
          mkdir -p deploy-jars
          cp admin/target/admin-0.0.1-SNAPSHOT.jar deploy-jars/sbadmin-latest.jar
          cp api/target/api-0.0.1-SNAPSHOT.jar deploy-jars/api-latest.jar
          cp ui/target/ui-0.0.1-SNAPSHOT.jar deploy-jars/ui-latest.jar
          cp front-api/target/front-api-0.0.1-SNAPSHOT.jar deploy-jars/front-api-latest.jar
          cp b2b-api/target/b2b-api-0.0.1-SNAPSHOT.jar deploy-jars/b2b-api-latest.jar

      ############################################
      # 7a. Build b2b-frontend
      ############################################
      - name: Set up Node.js for b2b-frontend
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Set up pnpm for b2b-frontend
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate

      - name: Install b2b-frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: b2b-frontend

      - name: Build b2b-frontend
        run: pnpm build
        working-directory: b2b-frontend
        env:
          NUXT_PUBLIC_BACKEND_BASE_URL: https://beta.api.product-data-api.com
          NUXT_BACKEND_PROXY_TARGET: http://localhost:8087

      - name: Package beta bundle
        # tar keeps the permissions and symlinks of the Nuxt output, which artifacts drop.
        run: tar -czf beta-backend-bundle.tgz deploy-jars b2b-frontend/.output

      - name: Upload beta bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: beta-backend-bundle
          path: beta-backend-bundle.tgz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Beta Publish
    needs: build
    # Never from a PR, a fork or another branch. During a freeze, only a manual dispatch deploys.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch' || vars.BETA_DEPLOY_FREEZE != 'true')
    runs-on: ubuntu-latest
    # Service secrets (Google SSO included) come from the `beta` GitHub Environment (ADR-0006, GOU-767, GOU-1041).
    environment: beta
    # One backend deploy at a time; a running restart is never interrupted. GitHub keeps only the newest
    # pending run, so the last merge ends up deployed.
    concurrency:
      group: deploy-beta-backend
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download beta bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: beta-backend-bundle

      - name: Unpack beta bundle
        run: tar -xzf beta-backend-bundle.tgz

      - name: 🚚 Deploy JARs to Qualification Server (Consolidated)
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rltgoDzvO"
          SOURCE: "deploy-jars/"
          REMOTE_HOST: ${{ secrets.REMOTE_BETA_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_BETA_USER }}
          TARGET: "/opt/open4goods/latest/"

      ############################################
      # 7a. Deploy b2b-frontend output
      ############################################
      - name: Deploy b2b-frontend output to beta server
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "b2b-frontend/.output"
          REMOTE_HOST: ${{ secrets.REMOTE_BETA_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_BETA_USER }}
          TARGET: "/opt/open4goods/latest/b2b-frontend"

      ############################################
      # 7b. Publish b2b-frontend container
      ############################################
      - name: Publish b2b-frontend
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.REMOTE_BETA_HOST }}
          username: ${{ secrets.REMOTE_BETA_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: sh /opt/open4goods/bin/publish-b2b-frontend.sh beta

      ############################################
      # 7c. Restarting Spring Applications
      ############################################
      - name: 🔐 Render service secrets on Beta
        # Same definition as serviceSecrets.yml and the release (scripts/deploy/render-service-secrets.sh, GOU-1041):
        # config tree files and env lines sourced by publish-jars.sh, outside the tree open4goods-config's deploy
        # rsyncs with --delete. A secret missing from `beta` is a warning and is not rendered: the service keeps its
        # previous render or the open4goods-config value. A set but malformed secret fails before anything is written.
        env:
          DEPLOY_SSH_HOST: ${{ secrets.REMOTE_BETA_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.REMOTE_BETA_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          API_GOOGLE_API_JSON: ${{ secrets.API_GOOGLE_API_JSON }}
          API_METRIKS_AWIN_PUBLISHER_ID: ${{ secrets.API_METRIKS_AWIN_PUBLISHER_ID }}
          API_METRIKS_AWIN_API_TOKEN: ${{ secrets.API_METRIKS_AWIN_API_TOKEN }}
          API_METRIKS_EFFILIATION_API_KEY: ${{ secrets.API_METRIKS_EFFILIATION_API_KEY }}
          API_EFFILIATION_API_KEY: ${{ secrets.API_EFFILIATION_API_KEY }}
          API_VERTEX_API_JSON: ${{ secrets.API_VERTEX_API_JSON }}
          API_VERTEX_BATCH_JSON: ${{ secrets.API_VERTEX_BATCH_JSON }}
          API_GOOGLE_SEARCH_API_KEY: ${{ secrets.API_GOOGLE_SEARCH_API_KEY }}
          API_OPENAI_API_KEY: ${{ secrets.API_OPENAI_API_KEY }}
          API_AWIN_ACCESS_TOKEN: ${{ secrets.API_AWIN_ACCESS_TOKEN }}
          API_KWANKO_TOKEN: ${{ secrets.API_KWANKO_TOKEN }}
          API_TRADETRACKER_API_KEY: ${{ secrets.API_TRADETRACKER_API_KEY }}
          API_EPREL_API_KEY: ${{ secrets.API_EPREL_API_KEY }}
          O4G_ICECAT_PASSWORD: ${{ secrets.O4G_ICECAT_PASSWORD }}
          O4G_SBA_PASSWORD: ${{ secrets.O4G_SBA_PASSWORD }}
          O4G_INTERNAL_API_KEY: ${{ secrets.O4G_INTERNAL_API_KEY }}
          API_METRIKS_KEY: ${{ secrets.API_METRIKS_KEY }}
          O4G_CAPTCHA_SECRET: ${{ secrets.O4G_CAPTCHA_SECRET }}
          O4G_MAIL_PASSWORD: ${{ secrets.O4G_MAIL_PASSWORD }}
          FRONT_API_JWT_SECRET: ${{ secrets.FRONT_API_JWT_SECRET }}
          O4G_MACHINE_TOKEN: ${{ secrets.O4G_MACHINE_TOKEN }}
          FRONT_API_GITHUB_TOKEN: ${{ secrets.FRONT_API_GITHUB_TOKEN }}
          GOOGLE_SSO_CLIENT_ID: ${{ secrets.GOOGLE_SSO_CLIENT_ID }}
          GOOGLE_SSO_CLIENT_SECRET: ${{ secrets.GOOGLE_SSO_CLIENT_SECRET }}
        run: |
          set -eu
          for svc in admin api front-api ui b2b-api; do
            scripts/deploy/render-service-secrets.sh --if-present apply beta "${svc}"
          done

      - name: Publish Applications
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.REMOTE_BETA_HOST }}
          username: ${{ secrets.REMOTE_BETA_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: sh /opt/open4goods/bin/publish-jars.sh beta

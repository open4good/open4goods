name: 🔑 Infra secrets (source + render + restart)
run-name: 🔑 Infra secrets ${{ inputs.env }} ${{ inputs.target }} (${{ inputs.mode }}) by @${{ github.actor }}

# Rotates an infrastructure secret from the `beta` or `prod` GitHub Environment (GOU-1092, campaign GOU-1038 wave 3):
# changes the password at its source, authenticated with the value currently in service on the host, renders it for
# its consumers (scripts/deploy/render-service-secrets.sh --source) and restarts them. Procedure and order:
# docs/operations/infra-secrets-rotation.md. Application secrets without a source go through serviceSecrets.yml.

on:
  workflow_dispatch:
    inputs:
      env:
        description: "GitHub Environment and host"
        required: true
        default: beta
        type: choice
        options: [beta, prod]
      target:
        description: "elasticsearch, kibana, mysql (prod), plausible* (beta), b2b-postgres: see infra-secrets-rotation.md"
        required: true
        default: elasticsearch
        type: choice
        options: [elasticsearch, kibana, mysql, plausible, plausible-postgres, plausible-clickhouse, b2b-postgres]
      mode:
        description: "test: checks only, nothing written. apply: source, render, restart. rollback: previous value back."
        required: true
        default: test
        type: choice
        options: [test, apply, rollback]

permissions:
  contents: read

jobs:
  rotate:
    # mode=test writes nothing and may run from a branch; apply and rollback only run the reviewed scripts of `main`.
    if: inputs.mode == 'test' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    timeout-minutes: 60

    # Same group as the deploys it would race (they restart the same services): never cancelled by another run of
    # this workflow nor by serviceSecrets.yml; a release, which cancels in progress, may still interrupt it.
    concurrency:
      group: ${{ inputs.env == 'prod' && 'deploy-prod' || 'deploy-beta-backend' }}
      cancel-in-progress: false

    env:
      TARGET_ENV: ${{ inputs.env }}
      TARGET: ${{ inputs.target }}
      MODE: ${{ inputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 🔐 Check the new values (no SSH)
        # Set, [A-Za-z0-9._-], 32 characters or more; the render check of their consumers. No value printed.
        if: env.MODE != 'rollback'
        env:
          O4G_ELASTICSEARCH_PASSWORD: ${{ inputs.target == 'elasticsearch' && secrets.O4G_ELASTICSEARCH_PASSWORD || '' }}
          INFRA_KIBANA_SYSTEM_PASSWORD: ${{ inputs.target == 'kibana' && secrets.INFRA_KIBANA_SYSTEM_PASSWORD || '' }}
          INFRA_KIBANA_ENCRYPTION_KEY: ${{ inputs.target == 'kibana' && secrets.INFRA_KIBANA_ENCRYPTION_KEY || '' }}
          INFRA_XWIKI_DB_PASSWORD: ${{ inputs.target == 'mysql' && secrets.INFRA_XWIKI_DB_PASSWORD || '' }}
          INFRA_MYSQL_ROOT_PASSWORD: ${{ inputs.target == 'mysql' && secrets.INFRA_MYSQL_ROOT_PASSWORD || '' }}
          INFRA_PLAUSIBLE_SECRET_KEY_BASE: ${{ inputs.target == 'plausible' && secrets.INFRA_PLAUSIBLE_SECRET_KEY_BASE || '' }}
          INFRA_PLAUSIBLE_PG_PASSWORD: ${{ inputs.target == 'plausible-postgres' && secrets.INFRA_PLAUSIBLE_PG_PASSWORD || '' }}
          INFRA_CLICKHOUSE_PASSWORD: ${{ inputs.target == 'plausible-clickhouse' && secrets.INFRA_CLICKHOUSE_PASSWORD || '' }}
          B2B_API_POSTGRES_PASSWORD: ${{ inputs.target == 'b2b-postgres' && secrets.B2B_API_POSTGRES_PASSWORD || '' }}
        run: scripts/deploy/infra-secrets.sh check "${TARGET_ENV}" "${TARGET}"

      - name: 🔎 Check the host and the value in service (read only)
        # Prerequisites, the credential in service found by authenticating with it, whether the new value is already
        # in service. Writes nothing.
        if: env.MODE != 'rollback'
        env:
          DEPLOY_SSH_HOST: ${{ inputs.env == 'prod' && secrets.REMOTE_HOST || secrets.REMOTE_BETA_HOST }}
          DEPLOY_SSH_USER: ${{ inputs.env == 'prod' && secrets.REMOTE_USER || secrets.REMOTE_BETA_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          O4G_ELASTICSEARCH_PASSWORD: ${{ inputs.target == 'elasticsearch' && secrets.O4G_ELASTICSEARCH_PASSWORD || '' }}
          INFRA_KIBANA_SYSTEM_PASSWORD: ${{ inputs.target == 'kibana' && secrets.INFRA_KIBANA_SYSTEM_PASSWORD || '' }}
          INFRA_KIBANA_ENCRYPTION_KEY: ${{ inputs.target == 'kibana' && secrets.INFRA_KIBANA_ENCRYPTION_KEY || '' }}
          INFRA_XWIKI_DB_PASSWORD: ${{ inputs.target == 'mysql' && secrets.INFRA_XWIKI_DB_PASSWORD || '' }}
          INFRA_MYSQL_ROOT_PASSWORD: ${{ inputs.target == 'mysql' && secrets.INFRA_MYSQL_ROOT_PASSWORD || '' }}
          INFRA_PLAUSIBLE_SECRET_KEY_BASE: ${{ inputs.target == 'plausible' && secrets.INFRA_PLAUSIBLE_SECRET_KEY_BASE || '' }}
          INFRA_PLAUSIBLE_PG_PASSWORD: ${{ inputs.target == 'plausible-postgres' && secrets.INFRA_PLAUSIBLE_PG_PASSWORD || '' }}
          INFRA_CLICKHOUSE_PASSWORD: ${{ inputs.target == 'plausible-clickhouse' && secrets.INFRA_CLICKHOUSE_PASSWORD || '' }}
          B2B_API_POSTGRES_PASSWORD: ${{ inputs.target == 'b2b-postgres' && secrets.B2B_API_POSTGRES_PASSWORD || '' }}
        run: scripts/deploy/infra-secrets.sh remote test "${TARGET_ENV}" "${TARGET}"

      - name: 🔑 Change the password at its source
        # The value in service is kept in /etc/open4goods/infra-previous.env (600) first. Skipped when the source
        # already accepts the new value (re-run after a partial apply).
        if: env.MODE == 'apply'
        env:
          DEPLOY_SSH_HOST: ${{ inputs.env == 'prod' && secrets.REMOTE_HOST || secrets.REMOTE_BETA_HOST }}
          DEPLOY_SSH_USER: ${{ inputs.env == 'prod' && secrets.REMOTE_USER || secrets.REMOTE_BETA_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          O4G_ELASTICSEARCH_PASSWORD: ${{ inputs.target == 'elasticsearch' && secrets.O4G_ELASTICSEARCH_PASSWORD || '' }}
          INFRA_KIBANA_SYSTEM_PASSWORD: ${{ inputs.target == 'kibana' && secrets.INFRA_KIBANA_SYSTEM_PASSWORD || '' }}
          INFRA_KIBANA_ENCRYPTION_KEY: ${{ inputs.target == 'kibana' && secrets.INFRA_KIBANA_ENCRYPTION_KEY || '' }}
          INFRA_XWIKI_DB_PASSWORD: ${{ inputs.target == 'mysql' && secrets.INFRA_XWIKI_DB_PASSWORD || '' }}
          INFRA_MYSQL_ROOT_PASSWORD: ${{ inputs.target == 'mysql' && secrets.INFRA_MYSQL_ROOT_PASSWORD || '' }}
          INFRA_PLAUSIBLE_SECRET_KEY_BASE: ${{ inputs.target == 'plausible' && secrets.INFRA_PLAUSIBLE_SECRET_KEY_BASE || '' }}
          INFRA_PLAUSIBLE_PG_PASSWORD: ${{ inputs.target == 'plausible-postgres' && secrets.INFRA_PLAUSIBLE_PG_PASSWORD || '' }}
          INFRA_CLICKHOUSE_PASSWORD: ${{ inputs.target == 'plausible-clickhouse' && secrets.INFRA_CLICKHOUSE_PASSWORD || '' }}
          B2B_API_POSTGRES_PASSWORD: ${{ inputs.target == 'b2b-postgres' && secrets.B2B_API_POSTGRES_PASSWORD || '' }}
        run: scripts/deploy/infra-secrets.sh remote source "${TARGET_ENV}" "${TARGET}"

      - name: 🔐 Render the Elasticsearch password for its consumers
        # The config tree file spring.elasticsearch.password of each Spring consumer.
        if: env.MODE == 'apply' && inputs.target == 'elasticsearch'
        env:
          DEPLOY_SSH_HOST: ${{ inputs.env == 'prod' && secrets.REMOTE_HOST || secrets.REMOTE_BETA_HOST }}
          DEPLOY_SSH_USER: ${{ inputs.env == 'prod' && secrets.REMOTE_USER || secrets.REMOTE_BETA_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          O4G_ELASTICSEARCH_PASSWORD: ${{ secrets.O4G_ELASTICSEARCH_PASSWORD }}
          # The other source row of b2b-api, never rendered by this target.
          B2B_API_POSTGRES_PASSWORD: ${{ inputs.target == 'b2b-postgres' && secrets.B2B_API_POSTGRES_PASSWORD || '' }}
        run: |
          set -eu
          for svc in front-api api ui b2b-api; do
            scripts/deploy/render-service-secrets.sh --source apply "${TARGET_ENV}" "${svc}"
          done

      - name: 🔐 Render the infra env file
        # /etc/open4goods/infra.env, the target's lines only (the other infra secrets are not mapped here).
        if: env.MODE == 'apply' && inputs.target != 'elasticsearch'
        env:
          DEPLOY_SSH_HOST: ${{ inputs.env == 'prod' && secrets.REMOTE_HOST || secrets.REMOTE_BETA_HOST }}
          DEPLOY_SSH_USER: ${{ inputs.env == 'prod' && secrets.REMOTE_USER || secrets.REMOTE_BETA_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          INFRA_KIBANA_SYSTEM_PASSWORD: ${{ inputs.target == 'kibana' && secrets.INFRA_KIBANA_SYSTEM_PASSWORD || '' }}
          INFRA_KIBANA_ENCRYPTION_KEY: ${{ inputs.target == 'kibana' && secrets.INFRA_KIBANA_ENCRYPTION_KEY || '' }}
          INFRA_XWIKI_DB_PASSWORD: ${{ inputs.target == 'mysql' && secrets.INFRA_XWIKI_DB_PASSWORD || '' }}
          INFRA_MYSQL_ROOT_PASSWORD: ${{ inputs.target == 'mysql' && secrets.INFRA_MYSQL_ROOT_PASSWORD || '' }}
          INFRA_PLAUSIBLE_SECRET_KEY_BASE: ${{ inputs.target == 'plausible' && secrets.INFRA_PLAUSIBLE_SECRET_KEY_BASE || '' }}
          INFRA_PLAUSIBLE_PG_PASSWORD: ${{ inputs.target == 'plausible-postgres' && secrets.INFRA_PLAUSIBLE_PG_PASSWORD || '' }}
          INFRA_CLICKHOUSE_PASSWORD: ${{ inputs.target == 'plausible-clickhouse' && secrets.INFRA_CLICKHOUSE_PASSWORD || '' }}
          B2B_API_POSTGRES_PASSWORD: ${{ inputs.target == 'b2b-postgres' && secrets.B2B_API_POSTGRES_PASSWORD || '' }}
        run: scripts/deploy/render-service-secrets.sh --source apply "${TARGET_ENV}" infra

      - name: 🔐 Render the b2b Postgres password for b2b-api
        # The config tree file spring.datasource.password of b2b-api (its compose line is in infra.env, above).
        if: env.MODE == 'apply' && inputs.target == 'b2b-postgres'
        env:
          DEPLOY_SSH_HOST: ${{ inputs.env == 'prod' && secrets.REMOTE_HOST || secrets.REMOTE_BETA_HOST }}
          DEPLOY_SSH_USER: ${{ inputs.env == 'prod' && secrets.REMOTE_USER || secrets.REMOTE_BETA_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          B2B_API_POSTGRES_PASSWORD: ${{ secrets.B2B_API_POSTGRES_PASSWORD }}
          # The other source row of b2b-api, never rendered by this target.
          O4G_ELASTICSEARCH_PASSWORD: ${{ inputs.target == 'elasticsearch' && secrets.O4G_ELASTICSEARCH_PASSWORD || '' }}
        run: scripts/deploy/render-service-secrets.sh --source apply "${TARGET_ENV}" b2b-api

      - name: 🔁 Restart the consumers
        # elasticsearch: front-api, api, ui, b2b-api one by one (publish-jars.sh); kibana: Kibana, then re-encryption
        # of the saved objects; mysql: XWiki only; plausible and plausible-postgres: Plausible; plausible-clickhouse:
        # ClickHouse (its new password), its dictionaries, then Plausible, checked to write; b2b-postgres: b2b-api.
        # Refuses a render without the new value.
        if: env.MODE == 'apply'
        env:
          DEPLOY_SSH_HOST: ${{ inputs.env == 'prod' && secrets.REMOTE_HOST || secrets.REMOTE_BETA_HOST }}
          DEPLOY_SSH_USER: ${{ inputs.env == 'prod' && secrets.REMOTE_USER || secrets.REMOTE_BETA_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          O4G_ELASTICSEARCH_PASSWORD: ${{ inputs.target == 'elasticsearch' && secrets.O4G_ELASTICSEARCH_PASSWORD || '' }}
          INFRA_KIBANA_SYSTEM_PASSWORD: ${{ inputs.target == 'kibana' && secrets.INFRA_KIBANA_SYSTEM_PASSWORD || '' }}
          INFRA_KIBANA_ENCRYPTION_KEY: ${{ inputs.target == 'kibana' && secrets.INFRA_KIBANA_ENCRYPTION_KEY || '' }}
          INFRA_XWIKI_DB_PASSWORD: ${{ inputs.target == 'mysql' && secrets.INFRA_XWIKI_DB_PASSWORD || '' }}
          INFRA_MYSQL_ROOT_PASSWORD: ${{ inputs.target == 'mysql' && secrets.INFRA_MYSQL_ROOT_PASSWORD || '' }}
          INFRA_PLAUSIBLE_SECRET_KEY_BASE: ${{ inputs.target == 'plausible' && secrets.INFRA_PLAUSIBLE_SECRET_KEY_BASE || '' }}
          INFRA_PLAUSIBLE_PG_PASSWORD: ${{ inputs.target == 'plausible-postgres' && secrets.INFRA_PLAUSIBLE_PG_PASSWORD || '' }}
          INFRA_CLICKHOUSE_PASSWORD: ${{ inputs.target == 'plausible-clickhouse' && secrets.INFRA_CLICKHOUSE_PASSWORD || '' }}
          B2B_API_POSTGRES_PASSWORD: ${{ inputs.target == 'b2b-postgres' && secrets.B2B_API_POSTGRES_PASSWORD || '' }}
        run: scripts/deploy/infra-secrets.sh remote restart "${TARGET_ENV}" "${TARGET}"

      - name: ↩️ Roll back to the previous value
        # Puts the value kept in /etc/open4goods/infra-previous.env back at the source and in the rendered files, then
        # restarts the consumers. The new value stays in the GitHub Environment: fix it before the next apply.
        if: env.MODE == 'rollback'
        env:
          DEPLOY_SSH_HOST: ${{ inputs.env == 'prod' && secrets.REMOTE_HOST || secrets.REMOTE_BETA_HOST }}
          DEPLOY_SSH_USER: ${{ inputs.env == 'prod' && secrets.REMOTE_USER || secrets.REMOTE_BETA_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          O4G_ELASTICSEARCH_PASSWORD: ${{ inputs.target == 'elasticsearch' && secrets.O4G_ELASTICSEARCH_PASSWORD || '' }}
          INFRA_KIBANA_SYSTEM_PASSWORD: ${{ inputs.target == 'kibana' && secrets.INFRA_KIBANA_SYSTEM_PASSWORD || '' }}
          INFRA_KIBANA_ENCRYPTION_KEY: ${{ inputs.target == 'kibana' && secrets.INFRA_KIBANA_ENCRYPTION_KEY || '' }}
          INFRA_XWIKI_DB_PASSWORD: ${{ inputs.target == 'mysql' && secrets.INFRA_XWIKI_DB_PASSWORD || '' }}
          INFRA_MYSQL_ROOT_PASSWORD: ${{ inputs.target == 'mysql' && secrets.INFRA_MYSQL_ROOT_PASSWORD || '' }}
          INFRA_PLAUSIBLE_SECRET_KEY_BASE: ${{ inputs.target == 'plausible' && secrets.INFRA_PLAUSIBLE_SECRET_KEY_BASE || '' }}
          INFRA_PLAUSIBLE_PG_PASSWORD: ${{ inputs.target == 'plausible-postgres' && secrets.INFRA_PLAUSIBLE_PG_PASSWORD || '' }}
          INFRA_CLICKHOUSE_PASSWORD: ${{ inputs.target == 'plausible-clickhouse' && secrets.INFRA_CLICKHOUSE_PASSWORD || '' }}
          B2B_API_POSTGRES_PASSWORD: ${{ inputs.target == 'b2b-postgres' && secrets.B2B_API_POSTGRES_PASSWORD || '' }}
        run: scripts/deploy/infra-secrets.sh remote rollback "${TARGET_ENV}" "${TARGET}"

      - name: 📋 Summary
        run: |
          case "${MODE}" in
            test) echo "mode=test: every check passed for ${TARGET} (${TARGET_ENV}); nothing written, nothing restarted." ;;
            apply) echo "${TARGET} (${TARGET_ENV}): changed at its source, rendered from the GitHub Environment, consumers restarted." ;;
            rollback) echo "${TARGET} (${TARGET_ENV}): previous value restored at its source and in its render; consumers restarted." ;;
          esac | tee -a "${GITHUB_STEP_SUMMARY}"

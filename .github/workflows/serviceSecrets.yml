name: 🔐 Service secrets (render + restart)
run-name: 🔐 Service secrets ${{ inputs.env }} ${{ inputs.service }} (${{ inputs.mode }}) by @${{ github.actor }}

# Renders services' secrets from the `beta` or `prod` GitHub Environment onto that environment's host and restarts
# those services only, without a deploy (D140, ADR-0006, GOU-933, GOU-1041). Replaces prodSecrets.yml. The deploy
# workflows render the same files through the same script: scripts/deploy/render-service-secrets.sh, whose table says
# which secret each service receives. Procedure: docs/operations/prod-service-secrets.md.

on:
  workflow_dispatch:
    inputs:
      env:
        description: "GitHub Environment and host"
        required: true
        default: beta
        type: choice
        options: [beta, prod]
      service:
        description: "Service whose secrets are rendered, then restarted (all: every service, coupled secrets included)"
        required: true
        default: all
        type: choice
        options: [all, api, ui, front-api, admin, b2b-api, frontend]
      mode:
        description: "test: checks only, nothing written, no restart. apply: render then restart."
        required: true
        default: test
        type: choice
        options: [test, apply]

permissions:
  contents: read

jobs:
  render:
    # mode=test writes nothing and may run from a branch; apply only runs the reviewed script of `main`.
    if: inputs.mode == 'test' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    timeout-minutes: 60

    # Same group as the deploy it would race: releaseDeployProd.yml (deploy-prod), testAndPublishBeta.yml
    # (deploy-beta-backend, also used for all) or frontend-ci.yml (deploy-beta-frontend). Never cancelled by another
    # run of this workflow; a release, which cancels in progress, may still interrupt it.
    concurrency:
      group: >-
        ${{ inputs.env == 'prod' && 'deploy-prod'
        || (inputs.service == 'frontend' && 'deploy-beta-frontend' || 'deploy-beta-backend') }}
      cancel-in-progress: false

    env:
      TARGET_ENV: ${{ inputs.env }}
      SERVICE: ${{ inputs.service }}
      MODE: ${{ inputs.mode }}
      # In restart order: front-api accepts the new machine token before the frontend sends it.
      SERVICES: ${{ inputs.service == 'all' && 'admin api front-api ui b2b-api frontend' || inputs.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 🔐 Check the services' secrets (no SSH)
        # Format only; no value printed. Fails when a required secret (Google SSO) is missing or a set secret is
        # malformed; a missing optional secret is a warning. Each secret is only mapped for the services that use it.
        env:
          API_GOOGLE_API_JSON: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_GOOGLE_API_JSON || '' }}
          API_METRIKS_AWIN_PUBLISHER_ID: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_METRIKS_AWIN_PUBLISHER_ID || '' }}
          API_METRIKS_AWIN_API_TOKEN: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_METRIKS_AWIN_API_TOKEN || '' }}
          API_METRIKS_EFFILIATION_API_KEY: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_METRIKS_EFFILIATION_API_KEY || '' }}
          API_EFFILIATION_API_KEY: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_EFFILIATION_API_KEY || '' }}
          API_VERTEX_API_JSON: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_VERTEX_API_JSON || '' }}
          API_VERTEX_BATCH_JSON: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_VERTEX_BATCH_JSON || '' }}
          API_GOOGLE_SEARCH_API_KEY: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_GOOGLE_SEARCH_API_KEY || '' }}
          API_OPENAI_API_KEY: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_OPENAI_API_KEY || '' }}
          API_AMAZON_ACCESS_KEY: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_AMAZON_ACCESS_KEY || '' }}
          API_AMAZON_SECRET_KEY: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_AMAZON_SECRET_KEY || '' }}
          API_AWIN_ACCESS_TOKEN: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_AWIN_ACCESS_TOKEN || '' }}
          API_KWANKO_TOKEN: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_KWANKO_TOKEN || '' }}
          API_TRADETRACKER_API_KEY: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_TRADETRACKER_API_KEY || '' }}
          API_EPREL_API_KEY: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_EPREL_API_KEY || '' }}
          O4G_ICECAT_PASSWORD: ${{ contains(fromJSON('["all","api","front-api"]'), inputs.service) && secrets.O4G_ICECAT_PASSWORD || '' }}
          O4G_SBA_PASSWORD: ${{ contains(fromJSON('["all","api","ui","front-api","admin","b2b-api"]'), inputs.service) && secrets.O4G_SBA_PASSWORD || '' }}
          O4G_INTERNAL_API_KEY: ${{ contains(fromJSON('["all","api","front-api"]'), inputs.service) && secrets.O4G_INTERNAL_API_KEY || '' }}
          O4G_CAPTCHA_SECRET: ${{ contains(fromJSON('["all","ui","front-api"]'), inputs.service) && secrets.O4G_CAPTCHA_SECRET || '' }}
          O4G_MAIL_PASSWORD: ${{ contains(fromJSON('["all","front-api","admin"]'), inputs.service) && secrets.O4G_MAIL_PASSWORD || '' }}
          FRONT_API_JWT_SECRET: ${{ contains(fromJSON('["all","front-api","frontend"]'), inputs.service) && secrets.FRONT_API_JWT_SECRET || '' }}
          O4G_MACHINE_TOKEN: ${{ contains(fromJSON('["all","front-api","frontend"]'), inputs.service) && secrets.O4G_MACHINE_TOKEN || '' }}
          FRONT_API_GITHUB_TOKEN: ${{ contains(fromJSON('["all","front-api"]'), inputs.service) && secrets.FRONT_API_GITHUB_TOKEN || '' }}
          GOOGLE_SSO_CLIENT_ID: ${{ contains(fromJSON('["all","front-api","frontend"]'), inputs.service) && secrets.GOOGLE_SSO_CLIENT_ID || '' }}
          GOOGLE_SSO_CLIENT_SECRET: ${{ contains(fromJSON('["all","frontend"]'), inputs.service) && secrets.GOOGLE_SSO_CLIENT_SECRET || '' }}
        run: |
          set -eu
          for svc in ${SERVICES}; do
            scripts/deploy/render-service-secrets.sh check "${TARGET_ENV}" "${svc}"
          done

      - name: 🔎 Check the host (read only)
        # A restart copies latest/<service>-latest.jar to runtime/<service>.jar, and publish-frontend.sh publishes
        # latest/frontend-ssr: refuse to restart onto a JAR or bundle that the last deploy did not start.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ inputs.env == 'prod' && secrets.REMOTE_HOST || secrets.REMOTE_BETA_HOST }}
          username: ${{ inputs.env == 'prod' && secrets.REMOTE_USER || secrets.REMOTE_BETA_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TARGET_ENV,SERVICES
          script: |
            set -eu
            fail() { echo "ERROR: $*"; exit 1; }
            case "${TARGET_ENV}" in
              beta | prod) ;;
              *) fail "Invalid environment" ;;
            esac
            writable_dir() {
              [ -d "$1" ] && [ -w "$1" ] && [ -x "$1" ] || fail "$1 is not a writable directory for $(id -un)"
              echo "OK: $1 is writable by $(id -un)"
            }
            for svc in ${SERVICES}; do
              case "${svc}" in
                api | ui | front-api | b2b-api) host_svc="${svc}" ;;
                admin) host_svc=sbadmin ;;
                frontend) host_svc=frontend ;;
                *) fail "Invalid service name" ;;
              esac
              echo "----- ${svc} -----"
              if [ "${svc}" = frontend ]; then
                env_file="/opt/open4goods/config/${TARGET_ENV}/frontend/.env"
                [ -f "${env_file}" ] && [ -w "${env_file}" ] || fail "${env_file} is not a writable file"
                echo "OK: ${env_file} exists and is writable"
                [ -f /opt/open4goods/bin/publish-frontend.sh ] || fail "/opt/open4goods/bin/publish-frontend.sh is missing"
                echo "OK: /opt/open4goods/bin/publish-frontend.sh is present"
                active=/opt/open4goods/bin/frontend-ssr/.output
                latest=/opt/open4goods/latest/frontend-ssr/.output
                for f in nitro.json server/index.mjs; do
                  [ -f "${active}/${f}" ] || fail "${active}/${f} is missing"
                  [ -f "${latest}/${f}" ] || fail "${latest}/${f} is missing"
                  cmp -s "${active}/${f}" "${latest}/${f}" \
                    || fail "${active}/${f} differs from ${latest}/${f}: a publish would deploy a bundle that is not running; deploy the frontend first"
                done
                echo "OK: the running frontend bundle is the one in /opt/open4goods/latest/frontend-ssr"
                continue
              fi
              writable_dir /etc/open4goods
              for dir in /etc/open4goods/secrets "/etc/open4goods/secrets/${host_svc}"; do
                if [ -e "${dir}" ]; then
                  writable_dir "${dir}"
                else
                  echo "OK: ${dir} does not exist yet (created on apply, mode 700)"
                fi
              done
              env_file="/etc/open4goods/${host_svc}.env"
              if [ -e "${env_file}" ]; then
                [ -r "${env_file}" ] || fail "${env_file} is not readable"
                echo "OK: ${env_file} exists and is readable"
              else
                echo "OK: ${env_file} does not exist yet (created on apply)"
              fi
              [ -f /opt/open4goods/bin/publish-jars.sh ] || fail "/opt/open4goods/bin/publish-jars.sh is missing"
              echo "OK: /opt/open4goods/bin/publish-jars.sh is present"
              runtime="/opt/open4goods/runtime/${host_svc}.jar"
              latest="/opt/open4goods/latest/${host_svc}-latest.jar"
              [ -f "${runtime}" ] || fail "${runtime} is missing"
              [ -f "${latest}" ] || fail "${latest} is missing"
              cmp -s "${runtime}" "${latest}" \
                || fail "${runtime} differs from ${latest}: a restart would deploy a JAR that is not running; deploy first"
              echo "OK: ${runtime} is identical to ${latest}"
            done

      - name: 🔐 Render the services' secrets
        if: env.MODE == 'apply'
        env:
          DEPLOY_SSH_HOST: ${{ inputs.env == 'prod' && secrets.REMOTE_HOST || secrets.REMOTE_BETA_HOST }}
          DEPLOY_SSH_USER: ${{ inputs.env == 'prod' && secrets.REMOTE_USER || secrets.REMOTE_BETA_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          API_GOOGLE_API_JSON: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_GOOGLE_API_JSON || '' }}
          API_METRIKS_AWIN_PUBLISHER_ID: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_METRIKS_AWIN_PUBLISHER_ID || '' }}
          API_METRIKS_AWIN_API_TOKEN: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_METRIKS_AWIN_API_TOKEN || '' }}
          API_METRIKS_EFFILIATION_API_KEY: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_METRIKS_EFFILIATION_API_KEY || '' }}
          API_EFFILIATION_API_KEY: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_EFFILIATION_API_KEY || '' }}
          API_VERTEX_API_JSON: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_VERTEX_API_JSON || '' }}
          API_VERTEX_BATCH_JSON: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_VERTEX_BATCH_JSON || '' }}
          API_GOOGLE_SEARCH_API_KEY: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_GOOGLE_SEARCH_API_KEY || '' }}
          API_OPENAI_API_KEY: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_OPENAI_API_KEY || '' }}
          API_AMAZON_ACCESS_KEY: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_AMAZON_ACCESS_KEY || '' }}
          API_AMAZON_SECRET_KEY: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_AMAZON_SECRET_KEY || '' }}
          API_AWIN_ACCESS_TOKEN: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_AWIN_ACCESS_TOKEN || '' }}
          API_KWANKO_TOKEN: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_KWANKO_TOKEN || '' }}
          API_TRADETRACKER_API_KEY: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_TRADETRACKER_API_KEY || '' }}
          API_EPREL_API_KEY: ${{ contains(fromJSON('["all","api"]'), inputs.service) && secrets.API_EPREL_API_KEY || '' }}
          O4G_ICECAT_PASSWORD: ${{ contains(fromJSON('["all","api","front-api"]'), inputs.service) && secrets.O4G_ICECAT_PASSWORD || '' }}
          O4G_SBA_PASSWORD: ${{ contains(fromJSON('["all","api","ui","front-api","admin","b2b-api"]'), inputs.service) && secrets.O4G_SBA_PASSWORD || '' }}
          O4G_INTERNAL_API_KEY: ${{ contains(fromJSON('["all","api","front-api"]'), inputs.service) && secrets.O4G_INTERNAL_API_KEY || '' }}
          O4G_CAPTCHA_SECRET: ${{ contains(fromJSON('["all","ui","front-api"]'), inputs.service) && secrets.O4G_CAPTCHA_SECRET || '' }}
          O4G_MAIL_PASSWORD: ${{ contains(fromJSON('["all","front-api","admin"]'), inputs.service) && secrets.O4G_MAIL_PASSWORD || '' }}
          FRONT_API_JWT_SECRET: ${{ contains(fromJSON('["all","front-api","frontend"]'), inputs.service) && secrets.FRONT_API_JWT_SECRET || '' }}
          O4G_MACHINE_TOKEN: ${{ contains(fromJSON('["all","front-api","frontend"]'), inputs.service) && secrets.O4G_MACHINE_TOKEN || '' }}
          FRONT_API_GITHUB_TOKEN: ${{ contains(fromJSON('["all","front-api"]'), inputs.service) && secrets.FRONT_API_GITHUB_TOKEN || '' }}
          GOOGLE_SSO_CLIENT_ID: ${{ contains(fromJSON('["all","front-api","frontend"]'), inputs.service) && secrets.GOOGLE_SSO_CLIENT_ID || '' }}
          GOOGLE_SSO_CLIENT_SECRET: ${{ contains(fromJSON('["all","frontend"]'), inputs.service) && secrets.GOOGLE_SSO_CLIENT_SECRET || '' }}
        run: |
          set -eu
          for svc in ${SERVICES}; do
            scripts/deploy/render-service-secrets.sh apply "${TARGET_ENV}" "${svc}"
          done

      - name: 🔁 Restart the services
        # all: rolling restart of every Spring service (sbadmin, api, front-api, ui, b2b-api), then the frontend, so
        # that the consumers of a coupled secret change together. Otherwise this service only. Each start waits for
        # its health check; publish-frontend.sh first checks that front-api accepts the frontend's machine token.
        if: env.MODE == 'apply'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ inputs.env == 'prod' && secrets.REMOTE_HOST || secrets.REMOTE_BETA_HOST }}
          username: ${{ inputs.env == 'prod' && secrets.REMOTE_USER || secrets.REMOTE_BETA_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TARGET_ENV,SERVICE
          command_timeout: 45m
          script: |
            set -eu
            case "${TARGET_ENV}" in
              beta | prod) ;;
              *) echo "ERROR: Invalid environment"; exit 1 ;;
            esac
            case "${SERVICE}" in
              all)
                sh /opt/open4goods/bin/publish-jars.sh "${TARGET_ENV}" restart
                sh /opt/open4goods/bin/publish-frontend.sh "${TARGET_ENV}"
                ;;
              api | ui | front-api | b2b-api) sh /opt/open4goods/bin/publish-jars.sh "${TARGET_ENV}" restart "${SERVICE}" ;;
              admin) sh /opt/open4goods/bin/publish-jars.sh "${TARGET_ENV}" restart sbadmin ;;
              frontend) sh /opt/open4goods/bin/publish-frontend.sh "${TARGET_ENV}" ;;
              *) echo "ERROR: Invalid service name"; exit 1 ;;
            esac

      - name: 📋 Summary
        run: |
          if [ "${SERVICE}" != all ]; then
            echo "::warning::Coupled secrets (O4G_SBA_PASSWORD, O4G_MACHINE_TOKEN, FRONT_API_JWT_SECRET, O4G_INTERNAL_API_KEY) must reach all their consumers in the same run: after changing one, use service=all."
          fi
          if [ "${MODE}" = apply ]; then
            echo "Secrets of ${SERVICES} rendered from the ${TARGET_ENV} GitHub Environment; restarted." | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "mode=test: every check passed for ${SERVICES} (${TARGET_ENV}); nothing written, nothing restarted." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi

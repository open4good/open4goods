name: 🚀 Release
run-name: 🚀 Release ${{ inputs.ref || github.ref_name }} (${{ inputs.mode || 'release' }}) by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target deployment environment"
        required: true
        default: prod
        type: choice
        options: [prod]
      confirmation:
        description: "Type deploy-prod to authorize production writes"
        required: true
        type: string
      ref:
        description: "Tag/branch/SHA à déployer (ex: v1.2.3). Laisse 'main' pour la branche principale."
        required: true
        default: "main"
        type: string
      mode:
        description: "Mode d'exécution (release ou test)"
        required: false
        default: release
        type: choice
        options: [release, test]

permissions:
  contents: write

jobs:
  frozen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse unqualified production promotion
        run: |
          echo "Production is frozen. GOU-53 must qualify immutable candidate promotion and rollback first." >&2
          echo "A fresh owner decision after GOU-31 is required; the legacy rebuild-and-deploy path is disabled." >&2
          exit 1

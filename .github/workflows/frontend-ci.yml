name: Frontend CI & Deploy
# Beta deployment runs on every merge on `main` that touches the Nuxt frontend or its content (GOU-1036).
# PR checks live in frontend-pr.yml. Set the repository variable BETA_DEPLOY_FREEZE=true to freeze beta during
# acceptance: a push still lints, tests and builds, but the deploy job is skipped. A manual dispatch on `main`
# still deploys, to ship a blocking fix.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      # Rendered by the docs collection of frontend/content.config.ts.
      - "docs/**"
      - "verticals/src/main/resources/guides/**"
      - "scripts/deploy/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A newer push supersedes an older build, so beta never receives an older commit after a newer one.
    # Scoped by event: a push during a freeze never cancels a manual dispatch shipping a blocking fix.
    concurrency:
      group: build-beta-frontend-${{ github.event_name }}
      cancel-in-progress: true
    steps:
      - name: Report beta deploy freeze
        if: vars.BETA_DEPLOY_FREEZE == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            message="BETA_DEPLOY_FREEZE=true: beta is frozen, but this manual dispatch deploys anyway."
          else
            message="BETA_DEPLOY_FREEZE=true: beta is frozen for acceptance. Lint, tests and build run; the deploy job is skipped."
            message="${message} Dispatch the workflow on main to ship a blocking fix."
          fi
          echo "::notice title=Beta deploy freeze::${message}"
          echo "### Beta deploy freeze" >> "${GITHUB_STEP_SUMMARY}"
          echo "${message}" >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Same major as the beta frontend-ssr container (node:24, ABI 137):
          # native modules such as better-sqlite3 are compiled at install time.
          node-version: "24"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.6
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm generate
        working-directory: frontend
      - run: pnpm test --run
        working-directory: frontend
      - name: Verify production build
        run: pnpm build
        working-directory: frontend

      - name: Check better-sqlite3 ABI matches Node 24 (frontend-ssr container)
        working-directory: frontend
        run: |
          addon=.output/server/node_modules/better-sqlite3/build/Release/better_sqlite3.node
          test -f "$addon" || { echo "::error::Missing $addon in the build output"; exit 1; }
          test "$(node -p process.versions.modules)" = 137 || { echo "::error::Runner Node ABI is not 137 (Node 24)"; exit 1; }
          nm -D --defined-only "$addon" | grep node_register_module_v137 >/dev/null || { echo "::error::$addon was not built for ABI 137 (Node 24)"; exit 1; }
          node -e "require(require('node:path').resolve(process.argv[1]))" "$addon"
          echo "better-sqlite3 native addon built for ABI 137 (Node 24)"
      - name: Check the standalone .output bundle serves the blog (no content/ next to it)
        working-directory: frontend
        run: scripts/check-standalone-output.sh 4105

      - name: Package SSR output
        # tar keeps the permissions and symlinks of .output (native addons, pnpm links), which artifacts drop.
        run: tar -czf frontend-ssr-output.tgz frontend/.output

      - name: Upload SSR output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-ssr-output
          path: frontend-ssr-output.tgz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: build
    # Never from a PR, a fork or another branch. During a freeze, only a manual dispatch deploys.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch' || vars.BETA_DEPLOY_FREEZE != 'true')
    runs-on: ubuntu-latest
    # Frontend secrets (Google SSO included) come from the `beta` GitHub Environment (ADR-0006, GOU-767, GOU-1041).
    environment: beta
    # One frontend deploy at a time; a running publish is never interrupted. GitHub keeps only the newest
    # pending run, so the last merge ends up deployed.
    concurrency:
      group: deploy-beta-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download SSR output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-ssr-output

      - name: Unpack SSR output
        run: tar -xzf frontend-ssr-output.tgz

      - name: Deploy SSR output to Beta server
        if: github.ref == 'refs/heads/main'
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "frontend/.output"
          REMOTE_HOST: ${{ secrets.REMOTE_BETA_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_BETA_USER }}
          TARGET: "/opt/open4goods/latest/frontend-ssr"

      - name: Preserve previous Nuxt chunks in Beta staging
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.REMOTE_BETA_HOST }}
          username: ${{ secrets.REMOTE_BETA_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            staging="/opt/open4goods/latest/frontend-ssr/.output/public/_nuxt"
            mkdir -p "${staging}"
            for source_bundle in /opt/open4goods/bin/frontend-ssr /opt/open4goods/previous/frontend-ssr; do
              source_nuxt="${source_bundle}/.output/public/_nuxt"
              if [ ! -d "${source_nuxt}" ]; then
                echo "Skipping missing Nuxt asset source: ${source_nuxt}"
                continue
              fi
              find "${source_nuxt}" -type f | while IFS= read -r source_file; do
                relative_path="${source_file#"${source_nuxt}/"}"
                target_file="${staging}/${relative_path}"
                if [ -e "${target_file}" ]; then
                  continue
                fi
                mkdir -p "$(dirname "${target_file}")"
                cp -p "${source_file}" "${target_file}"
              done
            done
            echo "Nuxt asset preservation complete for ${staging}"

      - name: 🔐 Render frontend secrets on Beta
        # Replaces only the frontend's keys in the env_file of docker-compose.frontend.yml, read when
        # publish-frontend.sh recreates the container (scripts/deploy/render-service-secrets.sh, GOU-1041).
        # open4goods-config's deploy rewrites this file: rendered before every publish. A secret missing from `beta`
        # is a warning and is not rendered (previous line kept).
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_SSH_HOST: ${{ secrets.REMOTE_BETA_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.REMOTE_BETA_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GOOGLE_SSO_CLIENT_ID: ${{ secrets.GOOGLE_SSO_CLIENT_ID }}
          GOOGLE_SSO_CLIENT_SECRET: ${{ secrets.GOOGLE_SSO_CLIENT_SECRET }}
          O4G_MACHINE_TOKEN: ${{ secrets.O4G_MACHINE_TOKEN }}
          FRONT_API_JWT_SECRET: ${{ secrets.FRONT_API_JWT_SECRET }}
        run: scripts/deploy/render-service-secrets.sh --if-present apply beta frontend

      - name: Publish frontend
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.REMOTE_BETA_HOST }}
          username: ${{ secrets.REMOTE_BETA_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: sh /opt/open4goods/bin/publish-frontend.sh beta

      - name: Validate published Beta Nuxt assets
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.REMOTE_BETA_HOST }}
          username: ${{ secrets.REMOTE_BETA_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            python3 - <<'PY'
            import html.parser
            import pathlib
            import re
            import sys
            import time
            import urllib.error
            import urllib.parse
            import urllib.request

            def active_frontend_base():
                upstream_file = pathlib.Path("/etc/nginx/open4goods/nudger-frontend-upstream.conf")
                content = upstream_file.read_text(encoding="utf-8")
                match = re.search(r"127\.0\.0\.1:(\d+)", content)
                if not match:
                    raise RuntimeError(f"Cannot find frontend port in {upstream_file}")
                return f"http://127.0.0.1:{match.group(1)}"

            base = active_frontend_base()
            pages = [
                base + "/",
                base + "/televiseurs/televiseur-55-pouces",
            ]

            class Parser(html.parser.HTMLParser):
                def __init__(self):
                    super().__init__()
                    self.assets = set()

                def handle_starttag(self, tag, attrs):
                    for name, value in attrs:
                        if name in {"src", "href"} and value and "/_nuxt/" in value:
                            self.assets.add(value)

            def fetch(url, attempts=1, delay=2):
                request = urllib.request.Request(url, headers={"User-Agent": "open4goods-post-publish-asset-check/1.0"})
                last_error = None
                for attempt in range(1, attempts + 1):
                    try:
                        with urllib.request.urlopen(request, timeout=20) as response:
                            return response.status, dict(response.headers), response.read()
                    except urllib.error.HTTPError as exc:
                        return exc.code, dict(exc.headers), exc.read()
                    except Exception as exc:
                        last_error = exc
                        if attempt == attempts:
                            break
                        print(f"Waiting for {url}: {exc} (attempt {attempt}/{attempts})")
                        time.sleep(delay)
                raise last_error

            failures = []
            checked = 0
            for page in pages:
                status, _, body = fetch(page, attempts=12, delay=5)
                if status >= 400:
                    failures.append((status, page, {}, "page failed"))
                    continue
                parser = Parser()
                parser.feed(body.decode("utf-8", errors="replace"))
                for asset in sorted(parser.assets):
                    asset_url = urllib.parse.urljoin(page, asset)
                    checked += 1
                    try:
                        asset_status, headers, asset_body = fetch(asset_url)
                    except Exception as exc:
                        failures.append((0, asset_url, {}, str(exc)))
                        continue
                    if asset_status >= 400:
                        failures.append((asset_status, asset_url, headers, asset_body[:512].decode("utf-8", errors="replace")))

            for path in ("/sw.js", "/_nuxt/builds/latest.json"):
                asset_url = base + path
                checked += 1
                try:
                    asset_status, headers, asset_body = fetch(asset_url)
                except Exception as exc:
                    failures.append((0, asset_url, {}, str(exc)))
                    continue
                if asset_status >= 400:
                    failures.append((asset_status, asset_url, headers, asset_body[:512].decode("utf-8", errors="replace")))

            if failures:
                print("frontend_asset_failure")
                for status, url, headers, excerpt in failures:
                    print(f"{status} {url}")
                    print({name: headers.get(name, "") for name in ("cf-ray", "cf-cache-status", "cache-control", "server")})
                    print(excerpt[:200])
                sys.exit(1)

            print(f"Validated {checked} Nuxt asset(s) from {len(pages)} page(s).")
            PY

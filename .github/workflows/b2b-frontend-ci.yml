name: B2B Frontend CI
# Checks only, no deployment: the b2b-frontend beta deploy runs with b2b-api in testAndPublishBeta.yml (GOU-1036).

on:
  push:
    paths:
      - "b2b-frontend/**"
      - ".github/workflows/b2b-frontend-ci.yml"
    branches: [main]
  pull_request:
    paths:
      - "b2b-frontend/**"
      - ".github/workflows/b2b-frontend-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.28.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: b2b-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: b2b-frontend

      - name: Lint
        run: pnpm lint
        working-directory: b2b-frontend

      - name: Typecheck
        run: pnpm typecheck
        working-directory: b2b-frontend

      - name: Test
        run: pnpm test
        working-directory: b2b-frontend

      - name: Build
        run: pnpm build
        working-directory: b2b-frontend

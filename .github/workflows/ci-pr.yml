name: ✅ CI - PR Check with Maven Build

on:
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "frontend/**"

jobs:
  test:
    name: PR Check - Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Set up Maven Repositories
        uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788 # v4.0.0
        with:
          repositories: |
            [
              {
                "id": "xwiki-releases",
                "name": "xwiki-releases",
                "url": "https://maven.xwiki.org/releases/",
                "snapshots": {
                  "enabled": false
                }
              }
            ]

      - name: Build and Test
        run: mvn --batch-mode --update-snapshots install

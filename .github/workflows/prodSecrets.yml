name: 🔐 Prod secrets (render + restart)
run-name: 🔐 Prod secrets ${{ inputs.service }} (${{ inputs.mode }}) by @${{ github.actor }}

# Renders a service's secrets from the `prod` GitHub Environment onto the prod host and restarts
# that service only, without a release (D140, ADR-0006, GOU-933). The release renders the same files
# through the same script: scripts/deploy/render-service-secrets.sh.
# Procedure: docs/operations/prod-service-secrets.md.

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service whose secrets are rendered, then restarted"
        required: true
        default: api
        type: choice
        options: [api]
      mode:
        description: "test: checks only, nothing written, no restart. apply: render then restart."
        required: true
        default: test
        type: choice
        options: [test, apply]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30

    # Same group as releaseDeployProd.yml: never runs alongside a release, and is never cancelled by
    # another run of this workflow (a release, which cancels in progress, may still interrupt it).
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    env:
      SERVICE: ${{ inputs.service }}
      MODE: ${{ inputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 🔐 Check the service's secrets (no SSH)
        # Presence and format only; no value printed. Fails when a required secret is missing (no --if-present
        # here); a missing optional API_METRIKS_* (GOU-957) or API_EFFILIATION_API_KEY (GOU-1014) secret is a warning.
        # Each secret is only mapped for the service that uses it.
        env:
          API_GOOGLE_API_JSON: ${{ inputs.service == 'api' && secrets.API_GOOGLE_API_JSON || '' }}
          API_METRIKS_AWIN_PUBLISHER_ID: ${{ inputs.service == 'api' && secrets.API_METRIKS_AWIN_PUBLISHER_ID || '' }}
          API_METRIKS_AWIN_API_TOKEN: ${{ inputs.service == 'api' && secrets.API_METRIKS_AWIN_API_TOKEN || '' }}
          API_METRIKS_EFFILIATION_API_KEY: ${{ inputs.service == 'api' && secrets.API_METRIKS_EFFILIATION_API_KEY || '' }}
          API_EFFILIATION_API_KEY: ${{ inputs.service == 'api' && secrets.API_EFFILIATION_API_KEY || '' }}
        run: scripts/deploy/render-service-secrets.sh check "${SERVICE}"

      - name: 🔎 Check the prod host (read only)
        # A restart copies latest/<service>-latest.jar to runtime/<service>.jar: refuse to restart onto a JAR
        # that the last release did not deploy.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SERVICE
          script: |
            set -eu
            fail() { echo "ERROR: $*"; exit 1; }
            case "${SERVICE}" in
              '' | *[!a-z0-9-]*) fail "Invalid service name" ;;
            esac
            [ -d /etc/open4goods ] && [ -w /etc/open4goods ] && [ -x /etc/open4goods ] \
              || fail "/etc/open4goods is not a writable directory for $(id -un)"
            echo "OK: /etc/open4goods is writable by $(id -un)"
            if [ -e /etc/open4goods/secrets ]; then
              [ -d /etc/open4goods/secrets ] && [ -w /etc/open4goods/secrets ] && [ -x /etc/open4goods/secrets ] \
                || fail "/etc/open4goods/secrets is not a writable directory for $(id -un)"
              echo "OK: /etc/open4goods/secrets is writable"
            else
              echo "OK: /etc/open4goods/secrets does not exist yet (created on apply, mode 700)"
            fi
            env_file="/etc/open4goods/${SERVICE}.env"
            if [ -e "${env_file}" ]; then
              [ -r "${env_file}" ] || fail "${env_file} is not readable"
              echo "OK: ${env_file} exists and is readable"
            else
              echo "OK: ${env_file} does not exist yet (created on apply)"
            fi
            [ -f /opt/open4goods/bin/publish-jars.sh ] || fail "/opt/open4goods/bin/publish-jars.sh is missing"
            echo "OK: /opt/open4goods/bin/publish-jars.sh is present"
            runtime="/opt/open4goods/runtime/${SERVICE}.jar"
            latest="/opt/open4goods/latest/${SERVICE}-latest.jar"
            [ -f "${runtime}" ] || fail "${runtime} is missing"
            [ -f "${latest}" ] || fail "${latest} is missing"
            cmp -s "${runtime}" "${latest}" \
              || fail "${runtime} differs from ${latest}: a restart would deploy a JAR that is not running; release first"
            echo "OK: ${runtime} is identical to ${latest}"

      - name: 🔐 Render the service's secrets on prod
        if: env.MODE == 'apply'
        env:
          DEPLOY_SSH_HOST: ${{ secrets.REMOTE_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.REMOTE_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          API_GOOGLE_API_JSON: ${{ inputs.service == 'api' && secrets.API_GOOGLE_API_JSON || '' }}
          API_METRIKS_AWIN_PUBLISHER_ID: ${{ inputs.service == 'api' && secrets.API_METRIKS_AWIN_PUBLISHER_ID || '' }}
          API_METRIKS_AWIN_API_TOKEN: ${{ inputs.service == 'api' && secrets.API_METRIKS_AWIN_API_TOKEN || '' }}
          API_METRIKS_EFFILIATION_API_KEY: ${{ inputs.service == 'api' && secrets.API_METRIKS_EFFILIATION_API_KEY || '' }}
          API_EFFILIATION_API_KEY: ${{ inputs.service == 'api' && secrets.API_EFFILIATION_API_KEY || '' }}
        run: scripts/deploy/render-service-secrets.sh apply "${SERVICE}"

      - name: 🔁 Restart the service
        # Restarts this service only and waits for its health check (HTTP 401).
        if: env.MODE == 'apply'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SERVICE
          command_timeout: 20m
          script: |
            set -eu
            case "${SERVICE}" in
              '' | *[!a-z0-9-]*) echo "ERROR: Invalid service name"; exit 1 ;;
            esac
            sh /opt/open4goods/bin/publish-jars.sh prod restart "${SERVICE}"

      - name: 📋 Summary
        run: |
          if [ "${MODE}" = apply ]; then
            echo "Secrets of ${SERVICE} rendered from the prod GitHub Environment; ${SERVICE} restarted." | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "mode=test: every check passed for ${SERVICE}; nothing written, nothing restarted." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi
